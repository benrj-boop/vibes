<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibes — APAC PMM</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eaeaea;
    --muted: #8892a4;
    --green: #4ecca3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, var(--highlight), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
  .week-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    border: 1px solid var(--accent);
    transition: border-color 0.2s;
  }
  .card.has-vibe { border-color: var(--green); }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .card-name { font-weight: 600; font-size: 1.1rem; }
  .card-market { color: var(--muted); font-size: 0.8rem; }
  .emoji-pick {
    font-size: 2.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.5rem;
    border-radius: 8px;
    background: var(--accent);
    margin-bottom: 0.75rem;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .emoji-pick:hover { background: #1a3a6e; }
  .emoji-pick.empty { font-size: 1rem; color: var(--muted); }
  .song-input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }
  .song-input::placeholder { color: var(--muted); }
  .clear-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .clear-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .log-btn {
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .log-btn:hover { opacity: 0.85; }
  .reset-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--green);
    color: var(--bg);
    padding: 1rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .history { margin-top: 3rem; }
  .history h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--muted); }
  .history-entry {
    background: var(--card);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--accent);
  }
  .history-date { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
  .history-vibes { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .history-vibe { font-size: 0.9rem; }
  .history-vibe .emoji { font-size: 1.3rem; margin-right: 0.25rem; }
  .emoji-picker-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .emoji-picker-overlay.open { display: flex; }
  .emoji-grid {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 360px;
    width: 90%;
    max-height: 400px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.5rem;
  }
  .emoji-option {
    font-size: 1.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.4rem;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .emoji-option:hover { background: var(--accent); }
</style>
</head>
<body>

<h1>Vibes</h1>
<p class="subtitle">APAC PMM weekly pulse</p>
<p class="week-label" id="weekLabel"></p>

<div class="team-grid" id="teamGrid"></div>

<div class="actions">
  <button class="log-btn" onclick="logVibes()">Log vibes & copy to clipboard</button>
  <button class="reset-btn" onclick="resetAll()">Reset all (new week)</button>
</div>

<div class="history" id="historySection">
  <h2>History</h2>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast">Copied to clipboard — paste into vibes-log.md</div>

<div class="emoji-picker-overlay" id="emojiOverlay" onclick="closeEmojiPicker(event)">
  <div class="emoji-grid" id="emojiGrid"></div>
</div>

<script>
const TEAM = [
  { id: 'ben', name: 'Ben', market: 'APAC Lead' },
  { id: 'karina', name: 'Karina', market: 'AUNZ' },
  { id: 'terrence', name: 'Terrence', market: 'GCN / SEA' },
  { id: 'jun', name: 'Jun', market: 'Japan' },
  { id: 'aditya', name: 'Aditya', market: 'India' },
];

const EMOJIS = [
  '🔥','💪','🚀','✨','😎','🎯','💡','🙌',
  '😊','🤙','☀️','🌊','🎶','🍜','🏃','⚡',
  '😤','💀','🫠','😵‍💫','🥱','😬','🤯','🫡',
  '🤔','👀','🧘','🌧️','☕','🍻','❤️','🎉',
  '📈','📉','⏳','🛑','🏔️','🌱','🪨','💎',
];

const STORAGE_KEY = 'vibes_current';
const HISTORY_KEY = 'vibes_history';
let currentPicker = null;

function getWeekLabel() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  const week = Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
  return `Week ${week} — ${now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
}

function loadState() {
  const saved = localStorage.getItem(STORAGE_KEY);
  return saved ? JSON.parse(saved) : {};
}

function saveState(state) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadHistory() {
  const saved = localStorage.getItem(HISTORY_KEY);
  return saved ? JSON.parse(saved) : [];
}

function saveHistory(history) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function render() {
  const state = loadState();
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';

  TEAM.forEach(member => {
    const data = state[member.id] || {};
    const hasVibe = !!data.emoji;
    const card = document.createElement('div');
    card.className = `card ${hasVibe ? 'has-vibe' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-name">${member.name}</div>
          <div class="card-market">${member.market}</div>
        </div>
        <button class="clear-btn" onclick="clearMember('${member.id}')">Clear</button>
      </div>
      <div class="emoji-pick ${hasVibe ? '' : 'empty'}" onclick="openEmojiPicker('${member.id}')">
        ${hasVibe ? data.emoji : 'Pick emoji'}
      </div>
      <input class="song-input" type="text" placeholder="Song / track name"
        value="${data.song || ''}"
        onchange="updateSong('${member.id}', this.value)"
        onkeyup="updateSong('${member.id}', this.value)">
    `;
    grid.appendChild(card);
  });

  renderHistory();
}

function openEmojiPicker(memberId) {
  currentPicker = memberId;
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map(e =>
    `<div class="emoji-option" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
  document.getElementById('emojiOverlay').classList.add('open');
}

function closeEmojiPicker(e) {
  if (e.target === document.getElementById('emojiOverlay')) {
    document.getElementById('emojiOverlay').classList.remove('open');
    currentPicker = null;
  }
}

function pickEmoji(emoji) {
  if (!currentPicker) return;
  const state = loadState();
  if (!state[currentPicker]) state[currentPicker] = {};
  state[currentPicker].emoji = emoji;
  saveState(state);
  document.getElementById('emojiOverlay').classList.remove('open');
  currentPicker = null;
  render();
}

function updateSong(memberId, value) {
  const state = loadState();
  if (!state[memberId]) state[memberId] = {};
  state[memberId].song = value;
  saveState(state);
}

function clearMember(memberId) {
  const state = loadState();
  delete state[memberId];
  saveState(state);
  render();
}

function resetAll() {
  if (!confirm('Start fresh for a new week? (History is preserved)')) return;
  localStorage.removeItem(STORAGE_KEY);
  render();
}

function logVibes() {
  const state = loadState();
  const now = new Date();
  const dateStr = now.toISOString().split('T')[0];

  let md = `## ${dateStr}\n\n`;
  md += `| Name | Vibe | Song |\n`;
  md += `|---|---|---|\n`;

  TEAM.forEach(member => {
    const data = state[member.id] || {};
    const emoji = data.emoji || '—';
    const song = data.song || '—';
    md += `| ${member.name} | ${emoji} | ${song} |\n`;
  });

  md += `\n---\n\n`;

  navigator.clipboard.writeText(md).then(() => {
    const history = loadHistory();
    const entry = { date: dateStr, vibes: {} };
    TEAM.forEach(member => {
      const data = state[member.id] || {};
      if (data.emoji) entry.vibes[member.id] = { emoji: data.emoji, song: data.song || '' };
    });
    history.unshift(entry);
    saveHistory(history);

    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);

    renderHistory();
  });
}

function renderHistory() {
  const history = loadHistory();
  const container = document.getElementById('historyList');

  if (history.length === 0) {
    container.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">No entries yet.</p>';
    return;
  }

  container.innerHTML = history.slice(0, 12).map(entry => `
    <div class="history-entry">
      <div class="history-date">${entry.date}</div>
      <div class="history-vibes">
        ${TEAM.map(m => {
          const v = entry.vibes[m.id];
          if (!v) return '';
          return `<span class="history-vibe"><span class="emoji">${v.emoji}</span> ${m.name}${v.song ? ' — ' + v.song : ''}</span>`;
        }).filter(Boolean).join('')}
      </div>
    </div>
  `).join('');
}

document.getElementById('weekLabel').textContent = getWeekLabel();
render();
</script>
</body>
</html>
