<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibes — APAC PMM</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eaeaea;
    --muted: #8892a4;
    --green: #4ecca3;
    --orange: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, var(--highlight), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); margin-bottom: 0.5rem; font-size: 0.9rem; }
  .week-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .dj-badge {
    display: inline-block;
    background: var(--orange);
    color: var(--bg);
    padding: 0.3rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding: 0.75rem 1rem;
    background: var(--card);
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .status-bar.offline .status-dot { background: var(--highlight); animation: none; }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    border: 1px solid var(--accent);
    transition: border-color 0.3s;
    position: relative;
  }
  .card.has-vibe { border-color: var(--green); }
  .card.is-dj { border-color: var(--orange); }
  .card.is-dj::after {
    content: 'DJ';
    position: absolute;
    top: -8px;
    right: 12px;
    background: var(--orange);
    color: var(--bg);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .card-name { font-weight: 600; font-size: 1.1rem; }
  .card-market { color: var(--muted); font-size: 0.8rem; }
  .emoji-pick {
    font-size: 2.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.5rem;
    border-radius: 8px;
    background: var(--accent);
    margin-bottom: 0.75rem;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .emoji-pick:hover { background: #1a3a6e; }
  .emoji-pick.empty { font-size: 1rem; color: var(--muted); }
  .song-input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }
  .song-input::placeholder { color: var(--muted); }
  .card-actions { display: flex; gap: 0.5rem; }
  .clear-btn, .save-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .clear-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .save-btn { border-color: var(--green); color: var(--green); }
  .save-btn:hover { background: var(--green); color: var(--bg); }
  .actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .log-btn {
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .log-btn:hover { opacity: 0.85; }
  .refresh-btn, .reset-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .refresh-btn:hover, .reset-btn:hover { border-color: var(--text); color: var(--text); }
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--green);
    color: var(--bg);
    padding: 1rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .history { margin-top: 3rem; }
  .history h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--muted); }
  .history-entry {
    background: var(--card);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--accent);
  }
  .history-date { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
  .history-vibes { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .history-vibe { font-size: 0.9rem; }
  .history-vibe .emoji { font-size: 1.3rem; margin-right: 0.25rem; }
  .emoji-picker-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .emoji-picker-overlay.open { display: flex; }
  .emoji-grid {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 360px;
    width: 90%;
    max-height: 400px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.5rem;
  }
  .emoji-option {
    font-size: 1.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.4rem;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .emoji-option:hover { background: var(--accent); }
  .setup-banner {
    background: var(--highlight);
    color: white;
    padding: 1rem 1.25rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  .setup-banner code {
    background: rgba(0,0,0,0.3);
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<h1>Vibes</h1>
<p class="subtitle">APAC PMM weekly pulse</p>
<p class="week-label" id="weekLabel"></p>
<div class="dj-badge" id="djBadge"></div>

<div class="status-bar" id="statusBar">
  <div class="status-dot"></div>
  <span id="statusText">Connecting...</span>
</div>

<div class="setup-banner" id="setupBanner" style="display:none;">
  Apps Script URL not configured. Set <code>SCRIPT_URL</code> in index.html after deploying the script.
</div>

<div class="team-grid" id="teamGrid"></div>

<div class="actions">
  <button class="log-btn" onclick="copyMarkdown()">Copy log to clipboard</button>
  <button class="refresh-btn" onclick="fetchVibes()">Refresh</button>
  <button class="reset-btn" onclick="resetWeek()">New week</button>
</div>

<div class="history" id="historySection">
  <h2>History</h2>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast"></div>

<div class="emoji-picker-overlay" id="emojiOverlay" onclick="closeEmojiPicker(event)">
  <div class="emoji-grid" id="emojiGrid"></div>
</div>

<script>
// ============================================================
// CONFIG — paste your Apps Script deployment URL here
// ============================================================
const SCRIPT_URL = '';
// ============================================================

const TEAM = [
  { id: 'ben', name: 'Ben', market: 'APAC Lead' },
  { id: 'karina', name: 'Karina', market: 'AUNZ' },
  { id: 'terrence', name: 'Terrence', market: 'GCN / SEA' },
  { id: 'jun', name: 'Jun', market: 'Japan' },
  { id: 'aditya', name: 'Aditya', market: 'India' },
];

const EMOJIS = [
  '🔥','💪','🚀','✨','😎','🎯','💡','🙌',
  '😊','🤙','☀️','🌊','🎶','🍜','🏃','⚡',
  '😤','💀','🫠','😵‍💫','🥱','😬','🤯','🫡',
  '🤔','👀','🧘','🌧️','☕','🍻','❤️','🎉',
  '📈','📉','⏳','🛑','🏔️','🌱','🪨','💎',
];

let currentPicker = null;
let vibesData = [];
let localState = {};

function getWeekNumber() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  return Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
}

function getWeekKey() {
  const now = new Date();
  return `${now.getFullYear()}-W${String(getWeekNumber()).padStart(2, '0')}`;
}

function getDateStr() {
  return new Date().toISOString().split('T')[0];
}

function getWeekLabel() {
  const now = new Date();
  return `Week ${getWeekNumber()} — ${now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
}

function getDJ() {
  const weekNum = getWeekNumber();
  return TEAM[weekNum % TEAM.length];
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function setStatus(online, text) {
  const bar = document.getElementById('statusBar');
  const txt = document.getElementById('statusText');
  bar.className = online ? 'status-bar' : 'status-bar offline';
  txt.textContent = text;
}

// ---- Data Layer ----

async function fetchVibes() {
  if (!SCRIPT_URL) {
    document.getElementById('setupBanner').style.display = 'block';
    setStatus(false, 'Not configured');
    renderFromLocal();
    return;
  }

  try {
    const res = await fetch(SCRIPT_URL);
    vibesData = await res.json();
    setStatus(true, `Synced — ${vibesData.length} entries`);

    // Update local state from remote for current week
    const week = getWeekKey();
    localState = {};
    vibesData.filter(r => r.week === week).forEach(r => {
      const member = TEAM.find(m => m.name === r.name);
      if (member) localState[member.id] = { emoji: r.emoji, song: r.song };
    });

    render();
  } catch (err) {
    setStatus(false, 'Offline — using local');
    renderFromLocal();
  }
}

async function saveVibe(memberId) {
  const member = TEAM.find(m => m.id === memberId);
  const data = localState[memberId] || {};

  if (!data.emoji) return;

  if (!SCRIPT_URL) {
    showToast('Saved locally (no backend configured)');
    return;
  }

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'save',
        week: getWeekKey(),
        date: getDateStr(),
        name: member.name,
        emoji: data.emoji,
        song: data.song || '',
      }),
    });
    showToast(`${member.name}'s vibe saved`);
  } catch (err) {
    showToast('Save failed — try again');
  }
}

async function clearVibe(memberId) {
  const member = TEAM.find(m => m.id === memberId);
  delete localState[memberId];
  render();

  if (!SCRIPT_URL) return;

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'clear',
        week: getWeekKey(),
        name: member.name,
      }),
    });
    showToast(`${member.name} cleared`);
  } catch (err) {
    showToast('Clear failed');
  }
}

function renderFromLocal() {
  const saved = localStorage.getItem('vibes_local');
  if (saved) localState = JSON.parse(saved);
  render();
}

// ---- Rendering ----

function render() {
  const grid = document.getElementById('teamGrid');
  const dj = getDJ();
  grid.innerHTML = '';

  TEAM.forEach(member => {
    const data = localState[member.id] || {};
    const hasVibe = !!data.emoji;
    const isDJ = member.id === dj.id;
    const card = document.createElement('div');
    card.className = `card ${hasVibe ? 'has-vibe' : ''} ${isDJ ? 'is-dj' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-name">${member.name}</div>
          <div class="card-market">${member.market}</div>
        </div>
      </div>
      <div class="emoji-pick ${hasVibe ? '' : 'empty'}" onclick="openEmojiPicker('${member.id}')">
        ${hasVibe ? data.emoji : 'Pick emoji'}
      </div>
      <input class="song-input" type="text" placeholder="${isDJ ? '🎵 Your DJ pick this week' : 'Song / track name'}"
        value="${data.song || ''}"
        onchange="updateSong('${member.id}', this.value)"
        onblur="saveVibe('${member.id}')">
      <div class="card-actions">
        <button class="save-btn" onclick="saveVibe('${member.id}')">Save</button>
        <button class="clear-btn" onclick="clearVibe('${member.id}')">Clear</button>
      </div>
    `;
    grid.appendChild(card);
  });

  // Save local backup
  localStorage.setItem('vibes_local', JSON.stringify(localState));

  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyList');
  const currentWeek = getWeekKey();

  // Group history by week
  const weeks = {};
  vibesData.forEach(row => {
    if (row.week === currentWeek) return;
    if (!weeks[row.week]) weeks[row.week] = { date: row.date, vibes: [] };
    weeks[row.week].vibes.push(row);
  });

  const sortedWeeks = Object.keys(weeks).sort().reverse().slice(0, 10);

  if (sortedWeeks.length === 0) {
    container.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">No past entries yet.</p>';
    return;
  }

  container.innerHTML = sortedWeeks.map(w => `
    <div class="history-entry">
      <div class="history-date">${w} (${weeks[w].date})</div>
      <div class="history-vibes">
        ${weeks[w].vibes.map(v =>
          `<span class="history-vibe"><span class="emoji">${v.emoji}</span> ${v.name}${v.song ? ' — ' + v.song : ''}</span>`
        ).join('')}
      </div>
    </div>
  `).join('');
}

// ---- Interactions ----

function openEmojiPicker(memberId) {
  currentPicker = memberId;
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map(e =>
    `<div class="emoji-option" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
  document.getElementById('emojiOverlay').classList.add('open');
}

function closeEmojiPicker(e) {
  if (e.target === document.getElementById('emojiOverlay')) {
    document.getElementById('emojiOverlay').classList.remove('open');
    currentPicker = null;
  }
}

function pickEmoji(emoji) {
  if (!currentPicker) return;
  if (!localState[currentPicker]) localState[currentPicker] = {};
  localState[currentPicker].emoji = emoji;
  document.getElementById('emojiOverlay').classList.remove('open');
  currentPicker = null;
  render();
  saveVibe(currentPicker || Object.keys(localState).pop());
}

function updateSong(memberId, value) {
  if (!localState[memberId]) localState[memberId] = {};
  localState[memberId].song = value;
  localStorage.setItem('vibes_local', JSON.stringify(localState));
}

function resetWeek() {
  if (!confirm('Start fresh for a new week? (History stays in the sheet)')) return;
  localState = {};
  localStorage.removeItem('vibes_local');
  render();
}

function copyMarkdown() {
  const week = getWeekKey();
  const date = getDateStr();
  const dj = getDJ();

  let md = `## ${date} (${week})\n\n`;
  md += `**DJ:** ${dj.name}\n\n`;
  md += `| Name | Vibe | Song |\n`;
  md += `|---|---|---|\n`;

  TEAM.forEach(member => {
    const data = localState[member.id] || {};
    const emoji = data.emoji || '—';
    const song = data.song || '—';
    md += `| ${member.name} | ${emoji} | ${song} |\n`;
  });

  md += `\n---\n\n`;

  navigator.clipboard.writeText(md).then(() => {
    showToast('Copied — paste into vibes-log.md');
  });
}

// ---- Init ----
document.getElementById('weekLabel').textContent = getWeekLabel();
document.getElementById('djBadge').textContent = `🎧 DJ this week: ${getDJ().name}`;
fetchVibes();

// Auto-refresh every 30s
setInterval(fetchVibes, 30000);
</script>
</body>
</html>
