<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibes — APAC PMM</title>
<style>
  :root {
    --bg: #1a1a2e;
    --card: #16213e;
    --accent: #0f3460;
    --highlight: #e94560;
    --text: #eaeaea;
    --muted: #8892a4;
    --green: #4ecca3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem;
    min-height: 100vh;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 0.25rem;
    background: linear-gradient(135deg, var(--highlight), #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.9rem; }
  .week-label { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    border: 1px solid var(--accent);
    transition: border-color 0.2s;
  }
  .card.has-vibe { border-color: var(--green); }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .card-name { font-weight: 600; font-size: 1.1rem; }
  .card-market { color: var(--muted); font-size: 0.8rem; }
  .emoji-pick {
    font-size: 2.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.5rem;
    border-radius: 8px;
    background: var(--accent);
    margin-bottom: 0.75rem;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .emoji-pick:hover { background: #1a3a6e; }
  .emoji-pick.empty { font-size: 1rem; color: var(--muted); }
  .song-input {
    width: 100%;
    padding: 0.6rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 0.75rem;
  }
  .song-input::placeholder { color: var(--muted); }
  .clear-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .clear-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .actions {
    display: flex;
    gap: 1rem;
    margin-top: 1rem;
    flex-wrap: wrap;
  }
  .log-btn {
    background: var(--green);
    color: var(--bg);
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .log-btn:hover { opacity: 0.85; }
  .reset-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--highlight); color: var(--highlight); }
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--green);
    color: var(--bg);
    padding: 1rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .history { margin-top: 3rem; }
  .history h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--muted); }
  .history-entry {
    background: var(--card);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--accent);
  }
  .history-date { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.5rem; }
  .history-vibes { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .history-vibe { font-size: 0.9rem; }
  .history-vibe .emoji { font-size: 1.3rem; margin-right: 0.25rem; }
  .emoji-picker-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .emoji-picker-overlay.open { display: flex; }
  .emoji-grid {
    background: var(--card);
    border-radius: 12px;
    padding: 1.5rem;
    max-width: 360px;
    width: 90%;
    max-height: 400px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0.5rem;
  }
  .emoji-option {
    font-size: 1.5rem;
    cursor: pointer;
    text-align: center;
    padding: 0.4rem;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .emoji-option:hover { background: var(--accent); }
</style>
</head>
<body>

<h1>Vibes</h1>
<p class="subtitle">APAC PMM weekly pulse</p>
<p class="week-label" id="weekLabel"></p>

<div class="team-grid" id="teamGrid"></div>

<div class="actions">
  <button class="log-btn" onclick="logVibes()">Log vibes & copy to clipboard</button>
  <button class="reset-btn" onclick="resetAll()">Reset all (new week)</button>
</div>

<div class="history" id="historySection">
  <h2>History</h2>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast"></div>

<div class="emoji-picker-overlay" id="emojiOverlay" onclick="closeEmojiPicker(event)">
  <div class="emoji-grid" id="emojiGrid"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/a/macros/stripe.com/s/AKfycbxrTgdwlufPu8l-2IY0CVsiGQhmXcYTqSDxyKgQh6YnVyxdFAr4tdzU3YPKFGYPWBUD/exec';

const TEAM = [
  { id: 'ben', name: 'Ben', market: 'APAC Lead' },
  { id: 'karina', name: 'Karina', market: 'AUNZ' },
  { id: 'terrence', name: 'Terrence', market: 'GCN / SEA' },
  { id: 'jun', name: 'Jun', market: 'Japan' },
  { id: 'aditya', name: 'Aditya', market: 'India' },
];

const EMOJIS = [
  '🔥','💪','🚀','✨','😎','🎯','💡','🙌',
  '😊','🤙','☀️','🌊','🎶','🍜','🏃','⚡',
  '😤','💀','🫠','😵‍💫','🥱','😬','🤯','🫡',
  '🤔','👀','🧘','🌧️','☕','🍻','❤️','🎉',
  '📈','📉','⏳','🛑','🏔️','🌱','🪨','💎',
];

let currentPicker = null;
let localState = {};
let allData = [];

function getWeekNumber() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 1);
  return Math.ceil(((now - start) / 86400000 + start.getDay() + 1) / 7);
}

function getWeekKey() {
  const now = new Date();
  return `${now.getFullYear()}-W${String(getWeekNumber()).padStart(2, '0')}`;
}

function getDateStr() {
  return new Date().toISOString().split('T')[0];
}

function getWeekLabel() {
  const now = new Date();
  return `Week ${getWeekNumber()} — ${now.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}`;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ---- Data ----

async function fetchVibes() {
  try {
    const res = await fetch(SCRIPT_URL);
    allData = await res.json();
    const week = getWeekKey();
    localState = {};
    allData.filter(r => r.week === week).forEach(r => {
      const member = TEAM.find(m => m.name === r.name);
      if (member && r.emoji) localState[member.id] = { emoji: r.emoji, song: r.song };
    });
  } catch (e) {
    const saved = localStorage.getItem('vibes_local');
    if (saved) localState = JSON.parse(saved);
  }
  render();
}

async function saveVibe(memberId) {
  const member = TEAM.find(m => m.id === memberId);
  const data = localState[memberId] || {};
  if (!data.emoji) return;

  localStorage.setItem('vibes_local', JSON.stringify(localState));

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'save',
        week: getWeekKey(),
        date: getDateStr(),
        name: member.name,
        emoji: data.emoji,
        song: data.song || '',
      }),
    });
  } catch (e) {}
}

async function clearVibe(memberId) {
  const member = TEAM.find(m => m.id === memberId);
  delete localState[memberId];
  localStorage.setItem('vibes_local', JSON.stringify(localState));
  render();

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'clear', week: getWeekKey(), name: member.name }),
    });
  } catch (e) {}
}

// ---- Render ----

function render() {
  const grid = document.getElementById('teamGrid');
  grid.innerHTML = '';

  TEAM.forEach(member => {
    const data = localState[member.id] || {};
    const hasVibe = !!data.emoji;
    const card = document.createElement('div');
    card.className = `card ${hasVibe ? 'has-vibe' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-name">${member.name}</div>
          <div class="card-market">${member.market}</div>
        </div>
        <button class="clear-btn" onclick="clearVibe('${member.id}')">Clear</button>
      </div>
      <div class="emoji-pick ${hasVibe ? '' : 'empty'}" onclick="openEmojiPicker('${member.id}')">
        ${hasVibe ? data.emoji : 'Pick emoji'}
      </div>
      <input class="song-input" type="text" placeholder="Song / track name"
        value="${data.song || ''}"
        onchange="updateSong('${member.id}', this.value)"
        onblur="saveVibe('${member.id}')">
    `;
    grid.appendChild(card);
  });

  renderHistory();
}

function renderHistory() {
  const container = document.getElementById('historyList');
  const currentWeek = getWeekKey();

  const weeks = {};
  allData.forEach(row => {
    if (row.week === currentWeek || !row.emoji) return;
    if (!weeks[row.week]) weeks[row.week] = { date: row.date, vibes: [] };
    weeks[row.week].vibes.push(row);
  });

  const sortedWeeks = Object.keys(weeks).sort().reverse().slice(0, 12);

  if (sortedWeeks.length === 0) {
    container.innerHTML = '<p style="color: var(--muted); font-size: 0.9rem;">No past entries yet.</p>';
    return;
  }

  container.innerHTML = sortedWeeks.map(w => `
    <div class="history-entry">
      <div class="history-date">${w} (${weeks[w].date})</div>
      <div class="history-vibes">
        ${weeks[w].vibes.map(v =>
          `<span class="history-vibe"><span class="emoji">${v.emoji}</span> ${v.name}${v.song ? ' — ' + v.song : ''}</span>`
        ).join('')}
      </div>
    </div>
  `).join('');
}

// ---- Interactions ----

function openEmojiPicker(memberId) {
  currentPicker = memberId;
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = EMOJIS.map(e =>
    `<div class="emoji-option" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
  document.getElementById('emojiOverlay').classList.add('open');
}

function closeEmojiPicker(e) {
  if (e.target === document.getElementById('emojiOverlay')) {
    document.getElementById('emojiOverlay').classList.remove('open');
    currentPicker = null;
  }
}

function pickEmoji(emoji) {
  if (!currentPicker) return;
  if (!localState[currentPicker]) localState[currentPicker] = {};
  localState[currentPicker].emoji = emoji;
  const memberId = currentPicker;
  document.getElementById('emojiOverlay').classList.remove('open');
  currentPicker = null;
  render();
  saveVibe(memberId);
}

function updateSong(memberId, value) {
  if (!localState[memberId]) localState[memberId] = {};
  localState[memberId].song = value;
  localStorage.setItem('vibes_local', JSON.stringify(localState));
}

function resetAll() {
  if (!confirm('Start fresh for a new week? (History stays in the sheet)')) return;
  localState = {};
  localStorage.removeItem('vibes_local');
  render();
}

function logVibes() {
  const date = getDateStr();
  const week = getWeekKey();

  let md = `## ${date} (${week})\n\n`;
  md += `| Name | Vibe | Song |\n`;
  md += `|---|---|---|\n`;

  TEAM.forEach(member => {
    const data = localState[member.id] || {};
    md += `| ${member.name} | ${data.emoji || '—'} | ${data.song || '—'} |\n`;
  });

  md += `\n---\n\n`;

  navigator.clipboard.writeText(md).then(() => {
    showToast('Copied — paste into vibes-log.md');
  });
}

// ---- Init ----
document.getElementById('weekLabel').textContent = getWeekLabel();
fetchVibes();
setInterval(fetchVibes, 30000);
</script>
</body>
</html>
