<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Check — Adventure Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f23;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 640px;
            height: 480px;
            border: 3px solid #333;
            border-radius: 12px;
            overflow: hidden;
            image-rendering: pixelated;
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .game-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .game-header h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-header p { font-size: 0.8rem; color: #666; margin-top: 0.25rem; }
        .badges {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            justify-content: center;
        }
        .badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0.3;
            transition: all 0.3s;
        }
        .badge.earned {
            opacity: 1;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }
        .controls-hint {
            font-size: 0.7rem;
            color: #555;
            margin-top: 0.5rem;
            text-align: center;
        }
        .mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #1a1a2e;
            color: #888;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .mode-toggle:hover { border-color: #667eea; color: #fff; }

        /* Battle/Dialogue overlay */
        .battle-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            flex-direction: column;
            padding: 2rem;
        }
        .battle-overlay.active { display: flex; }
        .battle-title {
            font-size: 1.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 0.5rem;
            animation: battleFlash 0.5s ease;
        }
        @keyframes battleFlash {
            0% { opacity: 0; transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .battle-subtitle {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .battle-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .battle-emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem;
            max-width: 360px;
            margin-bottom: 1rem;
        }
        .battle-emoji-btn {
            font-size: 1.5rem;
            padding: 0.5rem;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #1a1a2e;
            cursor: pointer;
            transition: all 0.1s;
            text-align: center;
        }
        .battle-emoji-btn:hover {
            background: #2a2a4e;
            transform: scale(1.15);
            border-color: #667eea;
        }
        .battle-emoji-btn.selected {
            border-color: #764ba2;
            background: #2a2a4e;
            transform: scale(1.2);
        }
        .battle-textarea {
            width: 100%;
            max-width: 400px;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 2px solid #333;
            background: #1a1a2e;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 80px;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .battle-textarea:focus { border-color: #667eea; }
        .battle-textarea::placeholder { color: #555; }
        .battle-actions {
            display: flex;
            gap: 0.75rem;
        }
        .battle-btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .battle-btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }
        .battle-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102,126,234,0.3); }
        .battle-btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .battle-btn-skip {
            background: #2a2a4e;
            color: #888;
        }
        .battle-btn-skip:hover { color: #ccc; }

        /* Dialogue box (Pokemon style) */
        .dialogue-box {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            color: #222;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            line-height: 1.5;
            border-top: 4px solid #333;
            min-height: 80px;
            z-index: 5;
        }
        .dialogue-box.active { display: block; }
        .dialogue-box .dialogue-continue {
            position: absolute;
            bottom: 0.5rem;
            right: 1rem;
            font-size: 0.7rem;
            color: #888;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Name select screen */
        .name-select {
            display: flex;
            position: absolute;
            inset: 0;
            background: #0f0f23;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        .name-select.hidden { display: none; }
        .name-select h2 {
            font-size: 1.3rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .name-select-grid {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .name-select-btn {
            padding: 1rem 2rem;
            border: 2px solid #333;
            border-radius: 12px;
            background: #1a1a2e;
            color: #ccc;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .name-select-btn:hover {
            border-color: #667eea;
            background: #2a2a4e;
            color: #fff;
            transform: scale(1.05);
        }

        /* Completion screen */
        .complete-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: #0f0f23;
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            text-align: center;
        }
        .complete-screen.active { display: flex; }
        .complete-screen h2 { font-size: 1.5rem; color: #4ade80; }
        .complete-screen p { color: #888; font-size: 0.9rem; }
        .complete-emoji { font-size: 4rem; animation: bounce 0.6s ease infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    </style>
</head>
<body>
    <a href="index.html" class="mode-toggle">classic mode</a>

    <div class="game-header">
        <h1>vibe check: adventure mode</h1>
        <p>explore stripe island and complete your check-in</p>
        <div class="badges" id="badges">
            <div class="badge" id="badge-vibe" title="Vibe">🎭</div>
            <div class="badge" id="badge-feeling" title="Feeling">💭</div>
            <div class="badge" id="badge-forward" title="Looking Forward">🌅</div>
            <div class="badge" id="badge-proud" title="Proud Of">🏆</div>
            <div class="badge" id="badge-discuss" title="Discuss">🗣️</div>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="640" height="480"></canvas>

        <!-- Name selection -->
        <div class="name-select" id="nameSelect">
            <h2>who are you?</h2>
            <div class="name-select-grid" id="nameGrid"></div>
        </div>

        <!-- Battle overlay -->
        <div class="battle-overlay" id="battleOverlay">
            <div class="battle-title" id="battleTitle"></div>
            <div class="battle-subtitle" id="battleSubtitle"></div>
            <div class="battle-content" id="battleContent"></div>
            <div class="battle-actions" id="battleActions"></div>
        </div>

        <!-- Dialogue box -->
        <div class="dialogue-box" id="dialogueBox">
            <span id="dialogueText"></span>
            <span class="dialogue-continue">▼ SPACE</span>
        </div>

        <!-- Completion -->
        <div class="complete-screen" id="completeScreen">
            <div class="complete-emoji">🎉</div>
            <h2>vibe check complete!</h2>
            <p>your check-in has been saved</p>
            <button class="battle-btn battle-btn-primary" onclick="location.reload()" style="margin-top:1rem">play again</button>
        </div>
    </div>

    <p class="controls-hint">arrow keys to move — space to interact — explore the island!</p>

<script>
const TEAM = ['Ben', 'Karina', 'Terrence', 'Jun', 'Aditya'];
const EMOJIS = ['🔥','😴','🚀','😤','🧘','🎉','💀','☕','🧠','💪','😅','🫠','✨','🌊','🎯','🤯','😎','🥲','🫡','🦾','🌈','😬','🍕','⚡'];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let playerName = null;
let gameState = 'nameSelect';
let player = { x: 320, y: 360, dir: 'down', frame: 0, frameTimer: 0 };
let keys = {};
let dialogueQueue = [];
let currentEncounter = null;
let completedEncounters = new Set();
let checkInData = { vibe: null, feeling: '', lookingForward: '', proudOf: '', talkAbout: '' };

// Map zones (NPCs/encounter spots)
const ZONES = [
    { id: 'vibe', x: 160, y: 120, w: 64, h: 64, emoji: '🎭', label: 'Emoji Shrine', badge: 'badge-vibe',
      encounter: { title: 'A wild VIBE CHECK appeared!', subtitle: 'pick your vibe energy', type: 'emoji' } },
    { id: 'feeling', x: 480, y: 120, w: 64, h: 64, emoji: '💭', label: 'Feelings Fountain', badge: 'badge-feeling',
      encounter: { title: 'The fountain speaks...', subtitle: 'how are you feeling today?', type: 'text', field: 'feeling', placeholder: 'in a sentence or less...' } },
    { id: 'forward', x: 100, y: 300, w: 64, h: 64, emoji: '🌅', label: 'Forward Bridge', badge: 'badge-forward',
      encounter: { title: 'You gaze across the bridge...', subtitle: 'one thing you\'re looking forward to?', type: 'text', field: 'lookingForward', placeholder: 'big or small, anything counts...' } },
    { id: 'proud', x: 520, y: 300, w: 64, h: 64, emoji: '🏆', label: 'Pride Peak', badge: 'badge-proud',
      encounter: { title: 'The mountain asks...', subtitle: 'something you were proud of this week?', type: 'text', field: 'proudOf', placeholder: 'a win, a moment, a thing you shipped...' } },
    { id: 'discuss', x: 320, y: 200, w: 64, h: 64, emoji: '🗣️', label: 'Discussion Den', badge: 'badge-discuss',
      encounter: { title: 'The elders convene...', subtitle: 'anything we need to talk about today?', type: 'text', field: 'talkAbout', placeholder: 'blockers, ideas, stuff on your mind...' } },
];

// Trees/decorations
const TREES = [
    { x: 50, y: 50 }, { x: 580, y: 50 }, { x: 50, y: 420 }, { x: 580, y: 420 },
    { x: 300, y: 50 }, { x: 400, y: 400 }, { x: 80, y: 200 }, { x: 560, y: 200 },
];

// Name select
const nameGrid = document.getElementById('nameGrid');
TEAM.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'name-select-btn';
    btn.textContent = name;
    btn.onclick = () => startGame(name);
    nameGrid.appendChild(btn);
});

function startGame(name) {
    playerName = name;
    document.getElementById('nameSelect').classList.add('hidden');
    gameState = 'playing';
    showDialogue([
        `Welcome to Stripe Island, ${name}!`,
        'Explore the island and visit each station to complete your vibe check.',
        'Walk up to a station and press SPACE to interact.'
    ]);
}

// Dialogue system
function showDialogue(messages) {
    dialogueQueue = [...messages];
    gameState = 'dialogue';
    advanceDialogue();
}

function advanceDialogue() {
    if (dialogueQueue.length === 0) {
        document.getElementById('dialogueBox').classList.remove('active');
        gameState = 'playing';
        return;
    }
    document.getElementById('dialogueBox').classList.add('active');
    document.getElementById('dialogueText').textContent = dialogueQueue.shift();
}

// Encounter system
function startEncounter(zone) {
    if (completedEncounters.has(zone.id)) {
        showDialogue(['You\'ve already visited here! Keep exploring.']);
        return;
    }
    currentEncounter = zone;
    gameState = 'battle';
    const overlay = document.getElementById('battleOverlay');
    overlay.classList.add('active');
    document.getElementById('battleTitle').textContent = zone.encounter.title;
    document.getElementById('battleSubtitle').textContent = zone.encounter.subtitle;

    const content = document.getElementById('battleContent');
    const actions = document.getElementById('battleActions');

    if (zone.encounter.type === 'emoji') {
        content.innerHTML = '<div class="battle-emoji-grid" id="battleEmojiGrid"></div>';
        const grid = document.getElementById('battleEmojiGrid');
        EMOJIS.forEach(emoji => {
            const btn = document.createElement('button');
            btn.className = 'battle-emoji-btn';
            btn.textContent = emoji;
            btn.onclick = () => {
                document.querySelectorAll('.battle-emoji-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                checkInData.vibe = emoji;
                document.getElementById('battleConfirmBtn').disabled = false;
            };
            grid.appendChild(btn);
        });
        actions.innerHTML = `
            <button class="battle-btn battle-btn-skip" onclick="skipEncounter()">skip</button>
            <button class="battle-btn battle-btn-primary" id="battleConfirmBtn" disabled onclick="confirmEncounter()">choose!</button>
        `;
    } else {
        content.innerHTML = `<textarea class="battle-textarea" id="battleInput" placeholder="${zone.encounter.placeholder}" maxlength="200"></textarea>`;
        actions.innerHTML = `
            <button class="battle-btn battle-btn-skip" onclick="skipEncounter()">skip</button>
            <button class="battle-btn battle-btn-primary" onclick="confirmTextEncounter()">submit</button>
        `;
        setTimeout(() => document.getElementById('battleInput').focus(), 100);
    }
}

function confirmEncounter() {
    completeEncounter();
}

function confirmTextEncounter() {
    const input = document.getElementById('battleInput');
    if (currentEncounter.encounter.field) {
        checkInData[currentEncounter.encounter.field] = input.value.trim();
    }
    completeEncounter();
}

function skipEncounter() {
    completeEncounter();
}

function completeEncounter() {
    completedEncounters.add(currentEncounter.id);
    document.getElementById(currentEncounter.badge).classList.add('earned');
    document.getElementById('battleOverlay').classList.remove('active');
    currentEncounter = null;
    gameState = 'playing';

    if (completedEncounters.size === ZONES.length) {
        setTimeout(() => finishGame(), 500);
    }
}

function finishGame() {
    // Save to localStorage (same format as classic mode)
    const entry = {
        name: playerName,
        vibe: checkInData.vibe || '🎮',
        type: 'emoji',
        feeling: checkInData.feeling || null,
        lookingForward: checkInData.lookingForward || null,
        proudOf: checkInData.proudOf || null,
        talkAbout: checkInData.talkAbout || null,
        time: new Date().toISOString()
    };

    let feed = JSON.parse(localStorage.getItem('vibecheck-feed') || '[]');
    feed.unshift(entry);
    localStorage.setItem('vibecheck-feed', JSON.stringify(feed));

    gameState = 'complete';
    document.getElementById('completeScreen').classList.add('active');
}

// Input
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (gameState === 'dialogue') {
            advanceDialogue();
        } else if (gameState === 'playing') {
            checkInteraction();
        }
    }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

function checkInteraction() {
    const px = player.x + 16;
    const py = player.y + 16;
    for (const zone of ZONES) {
        const dx = Math.abs(px - (zone.x + zone.w/2));
        const dy = Math.abs(py - (zone.y + zone.h/2));
        if (dx < 50 && dy < 50) {
            startEncounter(zone);
            return;
        }
    }
}

// Game loop
const SPEED = 3;

function update() {
    if (gameState !== 'playing') return;

    let moved = false;
    if (keys['ArrowUp'] || keys['w']) { player.y -= SPEED; player.dir = 'up'; moved = true; }
    if (keys['ArrowDown'] || keys['s']) { player.y += SPEED; player.dir = 'down'; moved = true; }
    if (keys['ArrowLeft'] || keys['a']) { player.x -= SPEED; player.dir = 'left'; moved = true; }
    if (keys['ArrowRight'] || keys['d']) { player.x += SPEED; player.dir = 'right'; moved = true; }

    // Bounds
    player.x = Math.max(10, Math.min(canvas.width - 42, player.x));
    player.y = Math.max(10, Math.min(canvas.height - 42, player.y));

    // Animation
    if (moved) {
        player.frameTimer++;
        if (player.frameTimer > 8) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }
    } else {
        player.frame = 0;
    }
}

function draw() {
    // Background (grass)
    ctx.fillStyle = '#1a472a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grass pattern
    ctx.fillStyle = '#1f5233';
    for (let x = 0; x < canvas.width; x += 32) {
        for (let y = 0; y < canvas.height; y += 32) {
            if ((x + y) % 64 === 0) ctx.fillRect(x, y, 32, 32);
        }
    }

    // Path (lighter area in center)
    ctx.fillStyle = '#2a5c3a';
    ctx.fillRect(200, 80, 240, 360);
    ctx.fillRect(60, 250, 520, 80);

    // Trees
    TREES.forEach(t => {
        ctx.font = '28px serif';
        ctx.fillText('🌲', t.x, t.y + 28);
    });

    // Zones (NPC stations)
    ZONES.forEach(zone => {
        const completed = completedEncounters.has(zone.id);
        // Glow if not completed
        if (!completed) {
            ctx.shadowColor = '#667eea';
            ctx.shadowBlur = 15;
        }
        ctx.font = '36px serif';
        ctx.textAlign = 'center';
        ctx.fillText(zone.emoji, zone.x + zone.w/2, zone.y + zone.h/2 + 12);
        ctx.shadowBlur = 0;

        // Label
        ctx.font = '10px -apple-system, sans-serif';
        ctx.fillStyle = completed ? '#555' : '#aaa';
        ctx.fillText(zone.label, zone.x + zone.w/2, zone.y + zone.h + 12);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'start';

        // Checkmark if done
        if (completed) {
            ctx.font = '14px serif';
            ctx.fillText('✓', zone.x + zone.w - 5, zone.y + 15);
        }
    });

    // Player
    drawPlayer();

    // Interaction hint
    if (gameState === 'playing') {
        const px = player.x + 16;
        const py = player.y + 16;
        for (const zone of ZONES) {
            const dx = Math.abs(px - (zone.x + zone.w/2));
            const dy = Math.abs(py - (zone.y + zone.h/2));
            if (dx < 50 && dy < 50 && !completedEncounters.has(zone.id)) {
                ctx.font = '11px -apple-system, sans-serif';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText('[ SPACE ]', zone.x + zone.w/2, zone.y - 8);
                ctx.textAlign = 'start';
                break;
            }
        }
    }
}

function drawPlayer() {
    const bobOffset = player.frame % 2 === 0 ? 0 : -2;

    // Body
    ctx.fillStyle = '#667eea';
    ctx.beginPath();
    ctx.arc(player.x + 16, player.y + 12 + bobOffset, 12, 0, Math.PI * 2);
    ctx.fill();

    // Face direction indicator
    ctx.fillStyle = '#fff';
    let eyeX = player.x + 16;
    let eyeY = player.y + 10 + bobOffset;
    if (player.dir === 'left') eyeX -= 4;
    if (player.dir === 'right') eyeX += 4;
    if (player.dir === 'up') eyeY -= 3;
    if (player.dir === 'down') eyeY += 3;
    ctx.beginPath();
    ctx.arc(eyeX - 3, eyeY, 2, 0, Math.PI * 2);
    ctx.arc(eyeX + 3, eyeY, 2, 0, Math.PI * 2);
    ctx.fill();

    // Name tag
    ctx.font = '10px -apple-system, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(playerName || '', player.x + 16, player.y + 32);
    ctx.textAlign = 'start';
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
