<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE CHECK — Adventure Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 720px;
            height: 540px;
            max-width: 100%;
            aspect-ratio: 720 / 540;
            border: 6px solid #222;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        @media (max-width: 960px) {
            #gameContainer {
                width: 100%;
                height: auto;
            }
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        .mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid #444;
            border-radius: 4px;
            background: #222;
            color: #888;
            font-size: 0.7rem;
            font-family: monospace;
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
        }
        .mode-toggle:hover { border-color: #888; color: #fff; }
        .controls-hint {
            font-size: 0.65rem;
            color: #444;
            margin-top: 0.5rem;
            font-family: monospace;
        }
        /* Hidden input for text encounters */
        #hiddenInput {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
        /* Mobile touch controls */
        .touch-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            pointer-events: none;
            z-index: 200;
        }
        .touch-controls.visible {
            display: block;
        }
        .dpad {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            pointer-events: auto;
        }
        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.7);
            font-size: 1.2rem;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .dpad-btn:active, .dpad-btn.active {
            background: rgba(255,255,255,0.4);
            border-color: rgba(255,255,255,0.6);
        }
        .dpad-up { top: 0; left: 50px; }
        .dpad-down { bottom: 0; left: 50px; }
        .dpad-left { top: 50px; left: 0; }
        .dpad-right { top: 50px; right: 0; }
        .action-btn {
            position: absolute;
            bottom: 40px;
            right: 30px;
            width: 64px;
            height: 64px;
            background: rgba(200,48,56,0.4);
            border: 2px solid rgba(200,48,56,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.85);
            font-size: 1.1rem;
            font-family: monospace;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            pointer-events: auto;
        }
        .action-btn:active, .action-btn.active {
            background: rgba(200,48,56,0.7);
            border-color: rgba(255,255,255,0.8);
        }
        /* Hide controls hint on touch devices */
        .is-touch .controls-hint {
            display: none;
        }
        /* Landscape suggestion for tiny screens */
        .landscape-hint {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            color: #888;
            font-family: monospace;
            font-size: 0.9rem;
            z-index: 999;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        @media (max-width: 480px) and (orientation: portrait) {
            .is-touch .landscape-hint {
                display: flex;
            }
        }
        /* Prevent overscroll on game container */
        #gameContainer {
            touch-action: none;
        }
    </style>
</head>

    [_,_,_,_,_,P,P,_,P,P,_,_,_,_,_,_],
    [_,_,_,_,_,P,P,_,P,P,_,_,_,_,_,_],
    [_,_,_,_,_,O,O,_,O,O,_,_,_,_,_,_],
];

function resolveColor(key, pal) {
    switch(key) {
        case 'S': return pal.skin;
        case 'H': return pal.hair;
        case 'T': return pal.shirt;
        case 'P': return pal.pants;
        case 'O': return pal.shoes;
        case 'A': return pal.accent;
        case 'B': return pal.accent2;
        case 'E': return '#081820';
        case 'W': return pal.skin; // mouth same as skin base
        default: return null;
    }
}

function drawCharSprite(x, y, charName, dir, frame, scale) {
    scale = scale || 1.5;
    const pal = CHAR_PALETTES[charName];
    if (!pal) return;

    const s = scale;
    const isWalking = frame % 2 !== 0;

    // Shadow (ellipse-like)
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(x + 8*s, y + 20*s, 5*s, 2*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Select sprite data based on direction
    let spriteData;
    let flipH = false;
    if (dir === 0) { // front
        spriteData = isWalking ? SPRITE_FRONT_WALK1 : SPRITE_FRONT;
    } else if (dir === 1) { // back
        spriteData = SPRITE_BACK;
    } else if (dir === 2) { // left
        spriteData = SPRITE_LEFT;
    } else { // right — mirror of left
        spriteData = SPRITE_LEFT;
        flipH = true;
    }

    // Walking bob
    const bob = isWalking ? -1*s : 0;

    // Draw pixel by pixel
    for (let row = 0; row < spriteData.length; row++) {
        for (let col = 0; col < spriteData[row].length; col++) {
            const key = spriteData[row][col];
            if (key === null) continue;
            const color = resolveColor(key, pal);
            if (!color) continue;
            ctx.fillStyle = color;
            const px = flipH ? (15 - col) : col;
            ctx.fillRect(x + px*s, y + bob + row*s, s + 0.5, s + 0.5);
        }
    }

    // Character-specific overlays drawn on top
    if (dir === 0 || dir === 2 || dir === 3) {
        if (charName === 'Ben') {
            // Red cap on top of head
            ctx.fillStyle = pal.accent;
            const capRow = 0;
            if (dir === 0) {
                for (let c = 4; c <= 11; c++) {
                    const px = flipH ? (15-c) : c;
                    ctx.fillRect(x+px*s, y+bob+capRow*s, s+0.5, s*2+0.5);
                }
                // Cap brim
                ctx.fillStyle = pal.accent2;
                for (let c = 3; c <= 12; c++) {
                    const px = flipH ? (15-c) : c;
                    ctx.fillRect(x+px*s, y+bob+2*s, s+0.5, s+0.5);
                }
            } else {
                // Side view cap
                const startC = flipH ? 5 : 5;
                const endC = flipH ? 12 : 11;
                for (let c = startC; c <= endC; c++) {
                    const px = flipH ? (15-c) : c;
                    ctx.fillRect(x+px*s, y+bob+0, s+0.5, s*2+0.5);
                }
                ctx.fillStyle = pal.accent2;
                const brimC = flipH ? 4 : 4;
                const brimE = flipH ? 7 : 7;
                for (let c = brimC; c <= brimE; c++) {
                    const px = flipH ? (15-c) : c;
                    ctx.fillRect(x+px*s, y+bob+2*s, s+0.5, s+0.5);
                }
            }
        }
        if (charName === 'Karina') {
            // Long blonde hair flowing down sides
            ctx.fillStyle = pal.hair;
            if (dir === 0) {
                for (let r = 3; r <= 11; r++) {
                    ctx.fillRect(x+3*s, y+bob+r*s, s+0.5, s+0.5);
                    ctx.fillRect(x+12*s, y+bob+r*s, s+0.5, s+0.5);
                }
                // Hair tips lighter
                ctx.fillStyle = pal.accent2;
                ctx.fillRect(x+3*s, y+bob+10*s, s+0.5, s*2+0.5);
                ctx.fillRect(x+12*s, y+bob+10*s, s+0.5, s*2+0.5);
            }
        }
        if (charName === 'Jun' && (dir === 0)) {
            // Glasses
            ctx.fillStyle = pal.accent;
            // Left lens frame
            ctx.fillRect(x+4*s, y+bob+3.5*s, s*3+0.5, s+0.5);
            ctx.fillRect(x+4*s, y+bob+5*s, s*3+0.5, s*0.5+0.5);
            ctx.fillRect(x+4*s, y+bob+3.5*s, s*0.5, s*2);
            ctx.fillRect(x+6.5*s, y+bob+3.5*s, s*0.5, s*2);
            // Right lens frame
            ctx.fillRect(x+8.5*s, y+bob+3.5*s, s*3+0.5, s+0.5);
            ctx.fillRect(x+8.5*s, y+bob+5*s, s*3+0.5, s*0.5+0.5);
            ctx.fillRect(x+8.5*s, y+bob+3.5*s, s*0.5, s*2);
            ctx.fillRect(x+11*s, y+bob+3.5*s, s*0.5, s*2);
            // Bridge
            ctx.fillRect(x+7*s, y+bob+4*s, s*1.5, s*0.5);
        }
        if (charName === 'Terrence' && dir === 0) {
            // Purple accent stripe on navy shirt
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+6*s, y+bob+9*s, s*4, s+0.5);
            ctx.fillRect(x+7*s, y+bob+10*s, s*2, s+0.5);
        }
        if (charName === 'Aditya' && dir === 0) {
            // White collar detail on orange shirt
            ctx.fillStyle = '#fff';
            ctx.fillRect(x+6*s, y+bob+8*s, s*4, s+0.5);
        }
    }

    // Eye shine (white dot in eyes for front view)
    if (dir === 0) {
        ctx.fillStyle = '#fff';
        ctx.fillRect(x+5.5*s, y+bob+4*s, s*0.5, s*0.5);
        ctx.fillRect(x+10.5*s, y+bob+4*s, s*0.5, s*0.5);
    }
}

let charSelectAnimTimer = 0;

// ============================================================
// TILE RENDERING — GBC Pokemon-style pixel art
// ============================================================
let waterFrame = 0;
let waterTick = 0;

function drawTile(tx, ty, type) {
    const x = tx * TILE;
    const y = ty * TILE;
    const T = TILE;
    const s = T / 16;

    switch(type) {
        case 0: // Grass — solid green, subtle sparse tufts
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Very sparse detail — only some tiles get tufts
            const grassSeed = (tx * 7 + ty * 13) % 17;
            if (grassSeed === 0) {
                // Small darker tuft (2 pixels)
                ctx.fillStyle = PAL.darkGreen;
                ctx.fillRect(x+4*s, y+10*s, s*2, s*2);
            } else if (grassSeed === 3) {
                ctx.fillStyle = PAL.darkGreen;
                ctx.fillRect(x+11*s, y+5*s, s, s*3);
                ctx.fillRect(x+10*s, y+6*s, s, s*2);
            } else if (grassSeed === 7) {
                // Tiny light highlight
                ctx.fillStyle = PAL.lightGreen;
                ctx.fillRect(x+8*s, y+12*s, s*2, s);
            }
            break;

        case 1: // Path — clean solid tan with subtle edge borders
            ctx.fillStyle = PAL.tan;
            ctx.fillRect(x, y, T, T);
            // Draw darker border on edges where path meets non-path
            ctx.fillStyle = PAL.brown;
            // Check adjacent tiles for border
            if (ty > 0 && MAP[ty-1] && MAP[ty-1][tx] !== 1) {
                ctx.fillRect(x, y, T, s); // top border
            }
            if (ty < ROWS-1 && MAP[ty+1] && MAP[ty+1][tx] !== 1) {
                ctx.fillRect(x, y+T-s, T, s); // bottom border
            }
            if (tx > 0 && MAP[ty][tx-1] !== 1) {
                ctx.fillRect(x, y, s, T); // left border
            }
            if (tx < COLS-1 && MAP[ty][tx+1] !== 1) {
                ctx.fillRect(x+T-s, y, s, T); // right border
            }
            break;

        case 2: // Tree — trunk + layered round canopy with shading
            // Grass base
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Brown trunk
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+6*s, y+12*s, 4*s, 5*s);
            // Trunk highlight
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x+7*s, y+12*s, 2*s, 4*s);
            // Canopy — dark outer layer (round shape)
            ctx.fillStyle = '#1a5c2a';
            ctx.fillRect(x+2*s, y+4*s, 12*s, 8*s);
            ctx.fillRect(x+3*s, y+2*s, 10*s, 2*s);
            ctx.fillRect(x+3*s, y+12*s, 10*s, 1*s);
            ctx.fillRect(x+4*s, y+1*s, 8*s, 1*s);
            // Canopy — medium green inner
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+3*s, y+4*s, 10*s, 7*s);
            ctx.fillRect(x+4*s, y+3*s, 8*s, 1*s);
            // Canopy — light highlight spot (top-left)
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x+4*s, y+4*s, 4*s, 3*s);
            ctx.fillRect(x+5*s, y+3*s, 3*s, 1*s);
            // Bright highlight dot
            ctx.fillStyle = PAL.lightGreen;
            ctx.fillRect(x+5*s, y+5*s, 2*s, 2*s);
            break;

        case 3: // Water — animated horizontal wave pattern
            // Base medium blue
            ctx.fillStyle = PAL.water;
            ctx.fillRect(x, y, T, T);
            // Animated wave lines (alternate every 30 ticks)
            ctx.fillStyle = PAL.waterLight;
            const wOff = waterFrame; // 0 or 1
            const shift = wOff * 3 * s;
            // Horizontal wavy lines at different heights
            for (let wy = 2; wy < 15; wy += 4) {
                const waveX = ((tx * 5 + wy * 3 + wOff * 2) % 6) * s;
                ctx.fillRect(x + waveX, y + wy*s, 8*s, s);
            }
            // Darker depth lines
            ctx.fillStyle = PAL.waterDark;
            for (let wy = 4; wy < 15; wy += 5) {
                const waveX = ((tx * 3 + wy * 7 + wOff) % 5) * s;
                ctx.fillRect(x + waveX + 2*s, y + wy*s, 5*s, s);
            }
            break;

        case 4: // Flower — grass with a small colored bloom
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Stem
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+7*s, y+9*s, s*2, s*4);
            // Leaf
            ctx.fillRect(x+5*s, y+11*s, s*2, s);
            ctx.fillRect(x+9*s, y+10*s, s*2, s);
            // Flower petals (3x3 with center)
            const flowerColor = ((tx + ty) % 2 === 0) ? PAL.red : '#e850a0';
            ctx.fillStyle = flowerColor;
            ctx.fillRect(x+6*s, y+6*s, s*4, s*3); // main petals
            ctx.fillRect(x+7*s, y+5*s, s*2, s); // top petal
            ctx.fillRect(x+7*s, y+9*s, s*2, s); // bottom petal
            // Yellow center
            ctx.fillStyle = PAL.yellow;
            ctx.fillRect(x+7*s, y+7*s, s*2, s*1);
            break;

        case 5: // Stone tile — gray cobblestone
            ctx.fillStyle = '#9898a0';
            ctx.fillRect(x, y, T, T);
            ctx.fillStyle = '#787880';
            ctx.fillRect(x, y, T, s);
            ctx.fillRect(x, y, s, T);
            ctx.fillStyle = '#b0b0b8';
            ctx.fillRect(x+3*s, y+3*s, 5*s, 4*s);
            ctx.fillRect(x+9*s, y+2*s, 4*s, 5*s);
            ctx.fillRect(x+2*s, y+9*s, 6*s, 4*s);
            ctx.fillRect(x+10*s, y+9*s, 4*s, 5*s);
            break;

        case 6: // Sand — warm sandy ground
            ctx.fillStyle = '#e8d8a8';
            ctx.fillRect(x, y, T, T);
            // Sand grain texture
            ctx.fillStyle = '#d0c090';
            const sandSeed = (tx * 11 + ty * 7) % 13;
            if (sandSeed < 4) {
                ctx.fillRect(x + (sandSeed*3)*s, y + (sandSeed*2+2)*s, s*2, s);
            }
            ctx.fillStyle = '#f0e8c0';
            if (sandSeed > 8) {
                ctx.fillRect(x + (sandSeed-5)*s, y + (sandSeed-3)*s, s, s);
            }
            break;

        case 7: // Bush — dark green rounded bush on grass
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Bush body
            ctx.fillStyle = '#1a5c2a';
            ctx.fillRect(x+2*s, y+6*s, 12*s, 9*s);
            ctx.fillRect(x+3*s, y+4*s, 10*s, 3*s);
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+3*s, y+6*s, 10*s, 7*s);
            // Highlight
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x+4*s, y+6*s, 4*s, 3*s);
            ctx.fillStyle = PAL.lightGreen;
            ctx.fillRect(x+5*s, y+7*s, 2*s, 2*s);
            break;

        case 8: // Bench — wooden bench on grass
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Bench legs
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+3*s, y+10*s, s*2, s*5);
            ctx.fillRect(x+11*s, y+10*s, s*2, s*5);
            // Seat
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x+2*s, y+8*s, 12*s, 3*s);
            // Back rest
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x+2*s, y+4*s, 12*s, 2*s);
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+2*s, y+6*s, s, 2*s);
            ctx.fillRect(x+13*s, y+6*s, s, 2*s);
            break;

        case 9: // Lamppost — tall post with glowing top on grass
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Post
            ctx.fillStyle = '#404040';
            ctx.fillRect(x+7*s, y+5*s, 2*s, 10*s);
            // Base
            ctx.fillStyle = '#505050';
            ctx.fillRect(x+5*s, y+14*s, 6*s, 2*s);
            // Lamp head
            ctx.fillStyle = '#606060';
            ctx.fillRect(x+5*s, y+3*s, 6*s, 3*s);
            // Glow
            const lampGlow = 0.3 + Math.sin(Date.now() / 800 + tx) * 0.15;
            ctx.fillStyle = `rgba(255,240,150,${lampGlow})`;
            ctx.fillRect(x+4*s, y+1*s, 8*s, 5*s);
            ctx.fillStyle = PAL.yellow;
            ctx.fillRect(x+6*s, y+4*s, 4*s, s);
            break;

        case 10: // Rock — gray rock on grass
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Rock shape
            ctx.fillStyle = '#808080';
            ctx.fillRect(x+4*s, y+8*s, 9*s, 6*s);
            ctx.fillRect(x+5*s, y+6*s, 7*s, 3*s);
            // Highlight
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(x+5*s, y+7*s, 4*s, 3*s);
            // Shadow
            ctx.fillStyle = '#606060';
            ctx.fillRect(x+9*s, y+10*s, 3*s, 3*s);
            break;

        case 11: // Dark grass — slightly different shade
            ctx.fillStyle = '#267842';
            ctx.fillRect(x, y, T, T);
            const dSeed = (tx * 11 + ty * 3) % 9;
            if (dSeed === 0) {
                ctx.fillStyle = '#1e6438';
                ctx.fillRect(x+5*s, y+8*s, s*2, s*2);
            } else if (dSeed === 4) {
                ctx.fillStyle = '#308850';
                ctx.fillRect(x+10*s, y+4*s, s*2, s);
            }
            break;

        case 12: // Gravel — gray pebbly ground
            ctx.fillStyle = '#a8a098';
            ctx.fillRect(x, y, T, T);
            ctx.fillStyle = '#908880';
            const gSeed = (tx * 5 + ty * 9) % 7;
            ctx.fillRect(x+(gSeed*2)*s, y+4*s, s*3, s*2);
            ctx.fillRect(x+8*s, y+(gSeed+5)*s, s*2, s*2);
            ctx.fillStyle = '#b8b0a8';
            ctx.fillRect(x+3*s, y+10*s, s*2, s*2);
            break;

        case 13: // Garden — grass with multiple small flowers
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Multiple tiny flowers
            const colors = ['#e850a0', PAL.red, PAL.yellow, '#a040e0'];
            for (let fi = 0; fi < 4; fi++) {
                const fx = (3 + fi * 3 + (ty % 2)) * s;
                const fy = (4 + (fi % 2) * 5 + (tx % 2) * 2) * s;
                ctx.fillStyle = colors[(fi + tx + ty) % 4];
                ctx.fillRect(x + fx, y + fy, s*2, s*2);
                ctx.fillStyle = PAL.yellow;
                ctx.fillRect(x + fx + s*0.5, y + fy + s*0.5, s, s);
            }
            // Little stems
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+4*s, y+8*s, s, s*3);
            ctx.fillRect(x+10*s, y+10*s, s, s*2);
            break;
    }
}

// ============================================================
// DISCO BALL RENDERING (animated sparkly decoration)
// ============================================================
let discoFrame = 0;
let discoTick = 0;

function drawDiscoBall(dbx, dby) {
    const cx = dbx * TILE + TILE / 2;
    const cy = dby * TILE + TILE / 2;
    const radius = 8;
    const s = TILE / 16;

    // String/chain from above
    ctx.fillStyle = '#606060';
    ctx.fillRect(cx - s*0.5, dby * TILE - 2*s, s, 5*s);

    // Ball body (circle approximation with filled rect grid)
    ctx.fillStyle = '#c0c0c8';
    ctx.beginPath();
    ctx.arc(cx, cy + 2*s, radius, 0, Math.PI * 2);
    ctx.fill();

    // Mirror tile grid pattern on the ball
    const t = Date.now() / 400;
    for (let i = 0; i < 6; i++) {
        const angle = t + i * (Math.PI / 3);
        const mx = cx + Math.cos(angle) * 4;
        const my = cy + 2*s + Math.sin(angle) * 4;
        ctx.fillStyle = i % 2 === 0 ? '#e8e8f0' : '#a0a0b0';
        ctx.fillRect(mx - s, my - s, s*2, s*2);
    }

    // Dark outline
    ctx.strokeStyle = '#808088';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy + 2*s, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Sparkle rays rotating outward
    const sparkleCount = 5;
    for (let i = 0; i < sparkleCount; i++) {
        const angle = (t * 1.5) + i * (Math.PI * 2 / sparkleCount);
        const dist = 10 + Math.sin(t * 2 + i) * 3;
        const sx = cx + Math.cos(angle) * dist;
        const sy = cy + 2*s + Math.sin(angle) * dist;
        const alpha = 0.5 + Math.sin(t * 3 + i * 2) * 0.4;
        // Star sparkle shape
        ctx.fillStyle = `rgba(255,255,200,${Math.max(0, alpha)})`;
        ctx.fillRect(sx - s, sy - s*0.5, s*2, s);
        ctx.fillRect(sx - s*0.5, sy - s, s, s*2);
    }

    // Highlight on ball
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(cx - 3, cy - 1, 3, 2);
}

function drawNPC(npc) {
    const x = npc.x * TILE;
    const y = npc.y * TILE;
    const s = TILE / 16;
    const completed = badges.has(npc.id);
    const baseColor = completed ? PAL.gray : npc.color;
    const darkColor = completed ? PAL.darkGray : shadeColor(npc.color, -30);

    // Ground circle/pedestal beneath NPC
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(x + 8*s, y + 15*s, 7*s, 3*s, 0, 0, Math.PI*2);
    ctx.fill();

    // Stone pedestal base
    ctx.fillStyle = '#a0a0a0';
    ctx.fillRect(x+3*s, y+13*s, 10*s, 3*s);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(x+4*s, y+13*s, 8*s, 2*s);

    // NPC body — small shrine/totem style
    // Pillar
    ctx.fillStyle = baseColor;
    ctx.fillRect(x+5*s, y+5*s, 6*s, 8*s);
    // Darker edges
    ctx.fillStyle = darkColor;
    ctx.fillRect(x+5*s, y+5*s, s, 8*s);
    ctx.fillRect(x+10*s, y+5*s, s, 8*s);

    // Top ornament (colored orb)
    ctx.fillStyle = baseColor;
    ctx.fillRect(x+4*s, y+2*s, 8*s, 4*s);
    ctx.fillRect(x+5*s, y+1*s, 6*s, 2*s);
    // Orb highlight
    if (!completed) {
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(x+5*s, y+2*s, 3*s, 2*s);
    }

    // Symbol on front (letter)
    ctx.fillStyle = PAL.white;
    ctx.font = `${8*s}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const symbol = npc.badge.charAt(0);
    ctx.fillText(symbol, x+8*s, y+9*s);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'top';

    // Glowing particle effect if not completed
    if (!completed) {
        const t = Date.now() / 1000;
        // Floating particles around the shrine
        for (let i = 0; i < 3; i++) {
            const angle = t * 2 + i * (Math.PI * 2 / 3);
            const px = x + 8*s + Math.cos(angle) * 6*s;
            const py = y + 6*s + Math.sin(angle * 0.7) * 4*s;
            const alpha = 0.4 + Math.sin(t * 3 + i) * 0.3;
            ctx.fillStyle = `rgba(255,255,100,${alpha})`;
            ctx.fillRect(px, py, s*1.5, s*1.5);
        }

        // Exclamation mark above
        const bounce = Math.sin(Date.now() / 300) * 2;
        ctx.fillStyle = PAL.yellow;
        ctx.fillRect(x+7*s, y - 7*s + bounce, 3*s, 4*s);
        ctx.fillRect(x+7*s, y - 2*s + bounce, 3*s, 2*s);
        // Black outline for visibility
        ctx.fillStyle = PAL.black;
        ctx.fillRect(x+6.5*s, y - 7.5*s + bounce, s*0.5, 4.5*s);
        ctx.fillRect(x+10*s, y - 7.5*s + bounce, s*0.5, 4.5*s);
    } else {
        // Checkmark for completed
        ctx.fillStyle = PAL.lightGreen;
        ctx.font = `${10*s}px monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('✓', x+8*s, y - 4*s);
        ctx.textAlign = 'start';
    }
}

// Helper to darken/lighten hex colors
function shadeColor(color, percent) {
    const num = parseInt(color.replace('#',''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return `#${(0x1000000 + R*0x10000 + G*0x100 + B).toString(16).slice(1)}`;
}

function drawPlayer() {
    const x = Math.round(player.px);
    const y = Math.round(player.py);
    const frame = player.moving ? player.step : 0;
    const dir = player.dir;

    // Draw using character sprite system — offset to center in tile
    // Sprite is 16*1.5=24 wide, 20*1.5=30 tall at 1.5x scale
    drawCharSprite(x, y - 6, playerName || 'Ben', dir, frame, 1.5);
}

// INTRO CINEMATIC SEQUENCE
// ============================================================
const INTRO_ROAD_LENGTH = 20; // tiles tall
const INTRO_MAP_W = 10; // tiles wide

function drawIntroTile(tx, ty, type, offsetY) {
    const x = tx * TILE + (CANVAS_W - INTRO_MAP_W * TILE) / 2;
    const y = ty * TILE + offsetY;
    const T = TILE;
    const s = T / 16;

    if (y < -TILE || y > CANVAS_H + TILE) return; // cull offscreen

    switch(type) {
        case 'grass':
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            if ((tx + ty * 7) % 11 === 0) {
                ctx.fillStyle = PAL.darkGreen;
                ctx.fillRect(x+5*s, y+8*s, s*2, s*2);
            }
            break;
        case 'path':
            ctx.fillStyle = PAL.tan;
            ctx.fillRect(x, y, T, T);
            // Subtle edge
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x, y, s, T);
            ctx.fillRect(x+T-s, y, s, T);
            break;
        case 'tree':
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, T, T);
            // Trunk
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+6*s, y+12*s, 4*s, 5*s);
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x+7*s, y+12*s, 2*s, 4*s);
            // Canopy layers
            ctx.fillStyle = '#1a5c2a';
            ctx.fillRect(x+2*s, y+4*s, 12*s, 8*s);
            ctx.fillRect(x+4*s, y+2*s, 8*s, 2*s);
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+3*s, y+4*s, 10*s, 7*s);
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x+4*s, y+4*s, 4*s, 3*s);
            ctx.fillStyle = PAL.lightGreen;
            ctx.fillRect(x+5*s, y+5*s, 2*s, 2*s);
            break;
        case 'building':
            // Walls with texture
            ctx.fillStyle = '#e8e0d0';
            ctx.fillRect(x, y, T, T);
            ctx.fillStyle = '#d8d0c0';
            ctx.fillRect(x, y, T, 2*s);
            // Windows with frames
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+2*s, y+5*s, 5*s, 5*s);
            ctx.fillRect(x+9*s, y+5*s, 5*s, 5*s);
            ctx.fillStyle = '#68b8e8';
            ctx.fillRect(x+3*s, y+6*s, 3*s, 3*s);
            ctx.fillRect(x+10*s, y+6*s, 3*s, 3*s);
            // Window shine
            ctx.fillStyle = '#a0e0ff';
            ctx.fillRect(x+3*s, y+6*s, s, s);
            ctx.fillRect(x+10*s, y+6*s, s, s);
            break;
        case 'roof':
            // Sloped roof with tiles
            ctx.fillStyle = '#8b3030';
            ctx.fillRect(x, y, T, T);
            // Tile pattern
            ctx.fillStyle = '#a04040';
            for (let r = 0; r < 4; r++) {
                const rOff = (r % 2) * 4 * s;
                for (let c = 0; c < 3; c++) {
                    ctx.fillRect(x + rOff + c*6*s, y + r*4*s, 4*s, 3*s);
                }
            }
            // Ridge at top
            ctx.fillStyle = '#c06060';
            ctx.fillRect(x, y, T, 2*s);
            break;
        case 'door':
            ctx.fillStyle = '#e8e0d0';
            ctx.fillRect(x, y, T, T);
            // Door arch
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+4*s, y+3*s, 8*s, 13*s);
            ctx.fillRect(x+5*s, y+2*s, 6*s, 1*s);
            // Door panels
            ctx.fillStyle = PAL.brown;
            ctx.fillRect(x+5*s, y+4*s, 3*s, 12*s);
            ctx.fillRect(x+9*s, y+4*s, 3*s, 12*s);
            // Door knob
            ctx.fillStyle = PAL.yellow;
            ctx.fillRect(x+8*s, y+10*s, s, s);
            break;
    }
}

function getIntroMap() {
    // 10 wide x 20 tall map
    // Building at top (rows 0-3), path down the middle, trees on sides
    const map = [];
    for (let row = 0; row < INTRO_ROAD_LENGTH; row++) {
        const r = [];
        for (let col = 0; col < INTRO_MAP_W; col++) {
            if (row === 0) {
                // Roof row
                if (col >= 3 && col <= 6) r.push('roof');
                else r.push('tree');
            } else if (row === 1) {
                // Building upper
                if (col >= 3 && col <= 6) r.push('building');
                else r.push('tree');
            } else if (row === 2) {
                // Building lower with door
                if (col === 4 || col === 5) r.push('door');
                else if (col === 3 || col === 6) r.push('building');
                else r.push('tree');
            } else if (row === 3) {
                // Path in front of building
                if (col >= 3 && col <= 6) r.push('path');
                else r.push('grass');
            } else {
                // Road section: trees on edges, grass, path in middle
                if (col === 0 || col === 9) r.push('tree');
                else if (col === 1 || col === 8) {
                    if (row % 3 === 0) r.push('tree');
                    else r.push('grass');
                } else if (col === 4 || col === 5) r.push('path');
                else r.push('grass');
            }
        }
        map.push(r);
    }
    return map;
}

const INTRO_MAP = getIntroMap();

function updateIntro() {
    introTimer++;

    if (introPhase === 'walk') {
        // Auto-walk upward for ~2.5 seconds (150 frames at 60fps)
        introPlayerY -= 1.2;
        if (introTimer > 140) {
            introPhase = 'flash';
            introFlashTimer = 0;
        }
    } else if (introPhase === 'flash') {
        introFlashTimer++;
        if (introFlashTimer > 40) {
            introPhase = 'text';
            introTextTimer = 0;
        }
    } else if (introPhase === 'text') {
        introTextTimer++;
        // Auto-advance after showing text for 2.5 seconds
        if (introTextTimer > 150) {
            transitionTimer = 30;
            transitionCallback = () => {
                state = 'dialogue';
                dialogueLines = [
                    'Welcome to VIBE ISLAND, ' + playerName + '!',
                    'Explore and visit each station.',
                    'Walk up and press SPACE to interact.',
                    'Complete all 5 to finish your check-in!'
                ];
                dialogueIdx = 0;
                dialogueCallback = () => { state = 'overworld'; };
            };
            introPhase = 'done';
        }
    }
}

function drawIntro() {
    updateIntro();

    if (introPhase === 'walk' || introPhase === 'flash') {
        // Calculate camera offset (follows player)
        const cameraY = introPlayerY + 80;

        // Background fill
        ctx.fillStyle = PAL.green;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Draw intro map
        for (let row = 0; row < INTRO_ROAD_LENGTH; row++) {
            const screenY = row * TILE - cameraY + CANVAS_H / 2;
            if (screenY > -TILE && screenY < CANVAS_H + TILE) {
                for (let col = 0; col < INTRO_MAP_W; col++) {
                    drawIntroTile(col, 0, INTRO_MAP[row][col], screenY);
                }
            }
        }

        // Draw player character (centered, walking up)
        const playerScreenX = (CANVAS_W - INTRO_MAP_W * TILE) / 2 + 4 * TILE + TILE/4;
        const playerScreenY = CANVAS_H / 2 - 12;
        const walkFrame = Math.floor(introTimer / 10) % 4;
        drawCharSprite(playerScreenX, playerScreenY, playerName || 'Ben', 1, walkFrame, 1.5);

        // Battle transition flash effect
        if (introPhase === 'flash') {
            const f = introFlashTimer;
            // Alternating black/white flashes (Pokemon style)
            if (f < 6 || (f > 10 && f < 16) || (f > 20 && f < 26)) {
                ctx.fillStyle = `rgba(255,255,255,${0.9 - (f % 10) * 0.05})`;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            } else if ((f > 6 && f < 10) || (f > 16 && f < 20) || (f > 26 && f < 30)) {
                ctx.fillStyle = `rgba(0,0,0,${0.9 - (f % 10) * 0.05})`;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            }
            // Final fade to black
            if (f > 30) {
                const alpha = Math.min(1, (f - 30) / 10);
                ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            }
        }
    } else if (introPhase === 'text') {
        // Black background with battle-style text
        ctx.fillStyle = PAL.black;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // Battle encounter dialogue box at bottom
        drawBox(8, CANVAS_H - 80, CANVAS_W - 16, 72);

        // "A wild TEAM MEETING appeared!" with typewriter effect
        const fullText = 'A wild TEAM MEETING appeared!';
        const visibleChars = Math.min(fullText.length, Math.floor(introTextTimer / 3));
        const displayText = fullText.substring(0, visibleChars);
        drawText(displayText, 24, CANVAS_H - 58, PAL.black, 1.2);

        // Blinking indicator after text is fully revealed
        if (visibleChars >= fullText.length && Math.floor(Date.now() / 400) % 2 === 0) {
            ctx.fillStyle = PAL.black;
            ctx.fillRect(CANVAS_W - 32, CANVAS_H - 20, 8, 6);
            ctx.fillRect(CANVAS_W - 30, CANVAS_H - 14, 4, 3);
        }
    }
}

function drawOverworld() {
    // Draw map tiles
    for (let ty = 0; ty < ROWS; ty++) {
        for (let tx = 0; tx < COLS; tx++) {
            drawTile(tx, ty, MAP[ty][tx]);
        }
    }

    // Draw disco balls
    for (const db of DISCO_BALLS) {
        drawDiscoBall(db.x, db.y);
    }

    // Draw NPCs
    for (const npc of NPCS) {
        drawNPC(npc);
    }

    // Draw player
    drawPlayer();

    // Interaction prompt
    if (state === 'overworld') {
        const facing = getFacingTile();
        for (const npc of NPCS) {
            if (npc.x === facing.x && npc.y === facing.y) {
                // Draw small prompt above NPC
                const nx = npc.x * TILE;
                const ny = npc.y * TILE;
                if (!badges.has(npc.id)) {
                    ctx.fillStyle = PAL.black;
                    ctx.fillRect(nx-3, ny-18, npc.name.length * 7 + 10, 15);
                    drawText(npc.name, nx+1, ny-16, PAL.white, 1);
                }
            }
        }
    }

    // Badge display at top
    drawBadgeBar();
}

function drawBadgeBar() {
    const badgeIcons = ['V','F','B','P','D'];
    const badgeColors = [PAL.red, PAL.blue, PAL.purple, PAL.yellow, PAL.green];
    const startX = CANVAS_W - 128;
    const y = 6;

    // Background panel
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(startX - 8, y - 4, 132, 24);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(startX - 7, y - 3, 130, 1);

    const npcIds = ['vibe','feeling','forward','proud','discuss'];
    for (let i = 0; i < 5; i++) {
        const bx = startX + i * 24 + 4;
        const by = y + 8;
        const earned = badges.has(npcIds[i]);
        const radius = 8;

        // Circle badge
        ctx.beginPath();
        ctx.arc(bx + radius, by, radius, 0, Math.PI * 2);
        if (earned) {
            ctx.fillStyle = badgeColors[i];
            ctx.fill();
            // Highlight ring
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            ctx.arc(bx + radius - 2, by - 2, 3, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Letter inside
        ctx.fillStyle = earned ? PAL.white : '#555';
        ctx.font = 'bold 9px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeIcons[i], bx + radius, by + 1);
    }
    ctx.textAlign = 'start';
    ctx.textBaseline = 'top';
}

        if (i === selIdx) {

            ctx.fillRect(ex - 2, ey - 2, 30, 30);
        }

        ctx.font = '22px serif';
        ctx.fillText(EMOJIS[i], ex + 8, ey + 28);
    }

    // Confirm button (clickable)
    ctx.fillStyle = PAL.green;
    ctx.fillRect(confirmBtnX, confirmBtnY, confirmBtnW, confirmBtnH);
    ctx.fillStyle = PAL.white;
    ctx.font = 'bold 12px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('CONFIRM', confirmBtnX + confirmBtnW/2, confirmBtnY + confirmBtnH/2);

    drawText('ARROWS:select SPACE/click:pick ESC:skip', 24, CANVAS_H - 24, PAL.darkGray, 1);
}

}

// ============================================================
// TRANSITION EFFECT
// ============================================================
function drawTransition() {
    if (transitionTimer <= 0) return true; // done

    const progress = transitionTimer / 30;
    // Screen wipe with black bars
    const barH = CANVAS_H * (1 - progress) / 2;
    ctx.fillStyle = PAL.black;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H/2 - barH * (CANVAS_H/2) + CANVAS_H/2 * (1-progress));

    // Flash effect
    if (transitionTimer > 25) {
        ctx.fillStyle = `rgba(255,255,255,${(transitionTimer-25)/5})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    if (transitionTimer > 15 && transitionTimer < 20) {
        ctx.fillStyle = PAL.black;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    transitionTimer--;
    if (transitionTimer <= 0 && transitionCallback) {
        transitionCallback();
        transitionCallback = null;
    }
    return false;
}

// ============================================================
// UI HELPER: Draw Pokemon-style box
// ============================================================
function drawBox(x, y, w, h) {
    // Outer border (black)
    ctx.fillStyle = PAL.black;
    ctx.fillRect(x, y, w, h);
    // Inner white
    ctx.fillStyle = PAL.white;
    ctx.fillRect(x+3, y+3, w-6, h-6);
    // Inner border
    ctx.strokeStyle = PAL.black;
    ctx.lineWidth = 2;
    ctx.strokeRect(x+6, y+6, w-12, h-12);
}

// ============================================================
// MOVEMENT & COLLISION
// ============================================================
function isWalkable(tx, ty) {
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return false;
    const tile = MAP[ty][tx];
    // Impassable: tree, water, bush, bench, lamppost, rock
    if (tile === 2 || tile === 3 || tile === 7 || tile === 8 || tile === 9 || tile === 10) return false;
    // Check NPC collision
    for (const npc of NPCS) {
        if (npc.x === tx && npc.y === ty) return false;
    }
    return true;
}

function getFacingTile() {
    return {
        x: player.x + DIR_DX[player.dir],
        y: player.y + DIR_DY[player.dir]
    };
}

function movePlayer() {
    if (player.moving) {
        // Animate toward target
        const targetX = player.x * TILE;
        const targetY = player.y * TILE;
        const speed = 3;

        if (Math.abs(player.px - targetX) > speed) {
            player.px += player.px < targetX ? speed : -speed;
        } else {
            player.px = targetX;
        }
        if (Math.abs(player.py - targetY) > speed) {
            player.py += player.py < targetY ? speed : -speed;
        } else {
            player.py = targetY;
        }

        if (player.px === targetX && player.py === targetY) {
            player.moving = false;
            // Easter egg: SNIPPETBOT trigger at bottom-left corner
            if (!snippetBotDefeated && player.x === 1 && player.y === 11) {
                triggerSnippetBot();
            }
        }

        player.animTimer++;
        if (player.animTimer > 8) {
            player.step = (player.step + 1) % 4;
            player.animTimer = 0;
        }
        return;
    }

    let dir = -1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dir = 1;
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) dir = 0;
    else if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir = 2;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) dir = 3;

    if (dir >= 0) {
        player.dir = dir;
        const nx = player.x + DIR_DX[dir];
        const ny = player.y + DIR_DY[dir];
        if (isWalkable(nx, ny)) {
            player.x = nx;
            player.y = ny;
            player.moving = true;
            player.animTimer = 0;
        }
    }
}

// ============================================================
// INPUT HANDLING
// ============================================================
document.addEventListener('keydown', (e) => {
    // ESC from overworld shows confirm dialog
    if (e.key === 'Escape' && state === 'overworld') {
        state = 'pauseMenu';
        pauseMenuIdx = 0;
        return;
    }
    if (e.key === 'Escape' && state === 'title') {
        window.location.href = 'index.html';
        return;
    }
    if (e.key === 'Escape' && state === 'pauseMenu') {
        state = 'overworld';
        return;
    }
    if (state === 'pauseMenu') {
        e.preventDefault();
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            pauseMenuIdx = (pauseMenuIdx - 1 + 3) % 3;
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            pauseMenuIdx = (pauseMenuIdx + 1) % 3;
        } else if (e.key === ' ' || e.key === 'Enter') {
            handlePauseMenuAction();
        }
        return;
    }
    if (textInputActive) {
        if (e.key === 'Enter') {
            e.preventDefault();
            submitTextInput();
        } else if (e.key === 'Backspace') {
            e.preventDefault();
            textInputValue = textInputValue.slice(0, -1);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            textInputValue = '';
            submitTextInput();
        } else if (e.key.length === 1 && textInputValue.length < 140) {
            textInputValue += e.key;
        }
        return;
    }

    keys[e.key] = true;

    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleAction();
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function handleAction() {
    switch (state) {
        case 'title':
            state = 'nameSelect';
            break;
        case 'intro':
            // SPACE skips entire intro and jumps to overworld
            introPhase = 'done';
            transitionTimer = 30;
            transitionCallback = () => {
                state = 'dialogue';
                dialogueLines = [
                    'Welcome to VIBE ISLAND, ' + playerName + '!',
                    'Explore and visit each station.',
                    'Walk up and press SPACE to interact.',
                    'Complete all 5 to finish your check-in!'
                ];
                dialogueIdx = 0;
                dialogueCallback = () => { state = 'overworld'; };
            };
            break;
        case 'nameSelect':
            playerName = TEAM[nameSelectIdx];
            // Start cinematic intro
            state = 'intro';
            introTimer = 0;
            introPhase = 'walk';
            introPlayerY = (INTRO_ROAD_LENGTH - 4) * TILE; // start near bottom
            introFlashTimer = 0;
            introTextTimer = 0;
            break;
        case 'dialogue':
            dialogueIdx++;
            if (dialogueIdx >= dialogueLines.length) {
                state = 'overworld';
                if (dialogueCallback) {
                    dialogueCallback();
                    dialogueCallback = null;
                }
            }
            break;
        case 'overworld':
            // Check if facing an NPC
            const facing = getFacingTile();
            for (const npc of NPCS) {
                if (npc.x === facing.x && npc.y === facing.y) {
                    interactWithNPC(npc);
                    return;
                }
            }
            break;
        case 'battle':
            handleBattleAction();
            break;
        case 'snippetBattle':
            handleSnippetBattleAction();
            break;
        case 'complete':
            if (completeTimer > 60) {
                location.reload();
            }
            break;
    }
}

function interactWithNPC(npc) {
    if (badges.has(npc.id)) {
        state = 'dialogue';
        dialogueLines = ['You already visited ' + npc.name + '!', 'Keep exploring!'];
        dialogueIdx = 0;
        dialogueCallback = null;
        return;
    }

    // Show NPC dialogue then transition to battle
    state = 'dialogue';
    dialogueLines = npc.dialogue;
    dialogueIdx = 0;
    dialogueCallback = () => {
        // Start battle transition
        transitionTimer = 30;
        transitionCallback = () => {
            state = 'battle';
            battleState = {
                active: true,
                npc: npc,
                encounter: npc.encounter,
                npcColor: npc.color,
                badgeName: npc.badge,
                phase: 'prompt',
                emojiIdx: 0,
            };
        };
    };
}

function handleBattleAction() {
    if (!battleState.active) return;

    if (battleState.phase === 'prompt') {
        if (battleState.encounter.type === 'emoji') {
            battleState.phase = 'emoji';
        } else {
            battleState.phase = 'text';
            textInputActive = true;
            textInputValue = '';
            hiddenInput.focus(); // trigger mobile keyboard
        }
    } else if (battleState.phase === 'emoji') {
        // Select current emoji
        const emoji = EMOJIS[battleState.emojiIdx];
        checkInData.vibe = emoji;
        battleState.phase = 'complete';
    } else if (battleState.phase === 'complete') {
        // End battle
        badges.add(battleState.npc.id);
        battleState.active = false;
        saveProgress(); // save after each encounter

        if (badges.size === 5) {
            transitionTimer = 30;
            transitionCallback = () => {
                finishGame();
            };
        } else {
            transitionTimer = 30;
            transitionCallback = () => {
                state = 'overworld';
            };
        }
    }
}

function submitTextInput() {
    textInputActive = false;
    const field = battleState.encounter.field;
    if (field) {
        checkInData[field] = textInputValue.trim();
    }
    battleState.phase = 'complete';
}

// Arrow key handling for emoji picker and name select
function handleArrowsForUI(key) {
    if (state === 'nameSelect') {
        if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
            nameSelectIdx = (nameSelectIdx - 1 + TEAM.length) % TEAM.length;
        } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
            nameSelectIdx = (nameSelectIdx + 1) % TEAM.length;
        }
    } else if (state === 'battle' && battleState.phase === 'emoji') {
        const cols = 8;
        const total = Math.min(EMOJIS.length, 24);
        let idx = battleState.emojiIdx;
        if (key === 'ArrowRight' || key === 'd' || key === 'D') idx = (idx + 1) % total;
        else if (key === 'ArrowLeft' || key === 'a' || key === 'A') idx = (idx - 1 + total) % total;
        else if (key === 'ArrowDown' || key === 's' || key === 'S') idx = Math.min(idx + cols, total - 1);
        else if (key === 'ArrowUp' || key === 'w' || key === 'W') idx = Math.max(idx - cols, 0);
        else if (key === 'Escape') { completeBattle(); return; }
        battleState.emojiIdx = idx;
    }
}

// Override keydown for UI navigation
document.addEventListener('keydown', (e) => {
    if (textInputActive) return;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D'].includes(e.key)) {
        handleArrowsForUI(e.key);
    }
});

// SNIPPETBOT EASTER EGG BATTLE
// ============================================================
function triggerSnippetBot() {
    snippetBotDefeated = true;
    // Screen flash transition then enter snippetBattle state
    transitionTimer = 30;
    transitionCallback = () => {
        state = 'snippetBattle';
        snippetBattleState = {
            phase: 'appear', // appear, move1, move2, move3, move4, xp, done
            timer: 0,
            textIdx: 0,
        };
    };
}

function drawSnippetBotSprite(x, y, scale) {
    const s = scale || 2;
    // Antenna
    ctx.fillStyle = '#888';
    ctx.fillRect(x + 14*s, y, 2*s, 6*s);
    // Antenna ball
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(x + 12*s, y - 3*s, 6*s, 4*s);
    // Blink on antenna
    ctx.fillStyle = '#ff8888';
    ctx.fillRect(x + 13*s, y - 2*s, 2*s, 2*s);

    // Head (square)
    ctx.fillStyle = '#445566';
    ctx.fillRect(x + 4*s, y + 6*s, 22*s, 18*s);
    // Head inner panel
    ctx.fillStyle = '#334455';
    ctx.fillRect(x + 6*s, y + 8*s, 18*s, 14*s);
    // Eyes (glowing)
    const glowAlpha = 0.5 + Math.sin(Date.now() / 200) * 0.3;
    ctx.fillStyle = `rgba(0, 255, 128, ${glowAlpha})`;
    ctx.fillRect(x + 9*s, y + 12*s, 4*s, 4*s);
    ctx.fillRect(x + 17*s, y + 12*s, 4*s, 4*s);
    // Eye cores
    ctx.fillStyle = '#00ff80';
    ctx.fillRect(x + 10*s, y + 13*s, 2*s, 2*s);
    ctx.fillRect(x + 18*s, y + 13*s, 2*s, 2*s);
    // Zigzag mouth
    ctx.fillStyle = '#ff6600';
    for (let i = 0; i < 5; i++) {
        const my = (i % 2 === 0) ? y + 19*s : y + 21*s;
        ctx.fillRect(x + (8 + i*3)*s, my, 3*s, 2*s);
    }

    // Neck
    ctx.fillStyle = '#666';
    ctx.fillRect(x + 12*s, y + 24*s, 6*s, 3*s);

    // Body (rectangular)
    ctx.fillStyle = '#556677';
    ctx.fillRect(x + 6*s, y + 27*s, 18*s, 20*s);
    // Body panel
    ctx.fillStyle = '#445566';
    ctx.fillRect(x + 8*s, y + 29*s, 14*s, 16*s);
    // Binary text on body
    ctx.fillStyle = '#00cc66';
    ctx.font = `${3*s}px monospace`;
    ctx.fillText('01101', x + 9*s, y + 33*s);
    ctx.fillText('SNIP', x + 9*s, y + 37*s);
    ctx.fillText('10010', x + 9*s, y + 41*s);

    // Arms
    ctx.fillStyle = '#666';
    ctx.fillRect(x + 1*s, y + 29*s, 5*s, 3*s);
    ctx.fillRect(x + 24*s, y + 29*s, 5*s, 3*s);
    // Claws
    ctx.fillStyle = '#888';
    ctx.fillRect(x, y + 32*s, 3*s, 6*s);
    ctx.fillRect(x + 27*s, y + 32*s, 3*s, 6*s);
}

function updateSnippetBattle() {
    if (!snippetBattleState) return;
    snippetBattleState.timer++;

    const t = snippetBattleState.timer;
    if (snippetBattleState.phase === 'appear' && t > 90) {
        snippetBattleState.phase = 'move1';
        snippetBattleState.timer = 0;
    } else if (snippetBattleState.phase === 'move1' && t > 80) {
        snippetBattleState.phase = 'move2';
        snippetBattleState.timer = 0;
    } else if (snippetBattleState.phase === 'move2' && t > 80) {
        snippetBattleState.phase = 'move3';
        snippetBattleState.timer = 0;
    } else if (snippetBattleState.phase === 'move3' && t > 80) {
        snippetBattleState.phase = 'move4';
        snippetBattleState.timer = 0;
    } else if (snippetBattleState.phase === 'move4' && t > 80) {
        snippetBattleState.phase = 'xp';
        snippetBattleState.timer = 0;
    } else if (snippetBattleState.phase === 'xp' && t > 100) {
        snippetBattleState.phase = 'done';
        snippetBattleState.timer = 0;
    }
}

function drawSnippetBattle() {
    updateSnippetBattle();
    if (!snippetBattleState) return;

    // Background
    ctx.fillStyle = PAL.paleGreen;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    const gradient = ctx.createLinearGradient(0, 0, 0, 160);
    gradient.addColorStop(0, '#88c070');
    gradient.addColorStop(1, '#a8d890');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, CANVAS_W, 160);
    ctx.fillStyle = '#78b858';
    ctx.fillRect(0, 140, CANVAS_W, 20);

    // Enemy platform + sprite
    const enemyX = CANVAS_W - 140;
    const enemyY = 20;
    ctx.fillStyle = '#60a040';
    ctx.fillRect(enemyX - 20, enemyY + 100, 100, 12);
    drawSnippetBotSprite(enemyX, enemyY, 2);

    // Player side
    const playerSprX = 50;
    const playerSprY = 80;
    ctx.fillStyle = '#60a040';
    ctx.fillRect(playerSprX - 15, playerSprY + 56, 80, 12);
    drawCharSprite(playerSprX, playerSprY - 6, playerName || 'Ben', 1, 0, 3);

    // Enemy info box
    drawBox(8, 8, 180, 44);
    drawText('SNIPPETBOT', 18, 18, PAL.black, 1);
    ctx.fillStyle = PAL.darkGray;
    ctx.fillRect(18, 36, 150, 6);
    // HP bar decreases in later phases
    let hpPct = 1;
    if (snippetBattleState.phase === 'move3') hpPct = 0.4;
    else if (snippetBattleState.phase === 'move4' || snippetBattleState.phase === 'xp' || snippetBattleState.phase === 'done') hpPct = 0;
    ctx.fillStyle = hpPct > 0.3 ? PAL.green : PAL.red;
    ctx.fillRect(18, 36, 150 * hpPct, 6);

    // Player info box
    drawBox(CANVAS_W - 180, 115, 170, 44);
    drawText(playerName || 'PLAYER', CANVAS_W - 170, 124, PAL.black, 1);
    ctx.fillStyle = PAL.darkGray;
    ctx.fillRect(CANVAS_W - 170, 142, 140, 6);
    ctx.fillStyle = PAL.green;
    ctx.fillRect(CANVAS_W - 170, 142, 140, 6);

    // Dialogue box
    drawBox(8, CANVAS_H - 80, CANVAS_W - 16, 72);

    const phase = snippetBattleState.phase;
    const t = snippetBattleState.timer;
    let line1 = '', line2 = '';

    if (phase === 'appear') {
        const fullText = 'A wild SNIPPETBOT appeared!';
        const chars = Math.min(fullText.length, Math.floor(t / 2));
        line1 = fullText.substring(0, chars);
    } else if (phase === 'move1') {
        line1 = 'SNIPPETBOT used DEADLINE REMINDER!';
        if (t > 40) line2 = "It's super effective...";
    } else if (phase === 'move2') {
        line1 = (playerName || 'PLAYER') + ' used SUBMIT ON TIME!';
    } else if (phase === 'move3') {
        line1 = 'SNIPPETBOT was defeated!';
    } else if (phase === 'move4') {
        line1 = 'SNIPPETBOT fainted!';
    } else if (phase === 'xp') {
        line1 = 'You earned 500 XP!';
        line2 = 'The snippet menace is vanquished.';
    } else if (phase === 'done') {
        line1 = 'Press SPACE to continue...';
    }

    drawText(line1, 24, CANVAS_H - 58, PAL.black, 1.1);
    if (line2) drawText(line2, 24, CANVAS_H - 36, PAL.black, 1);

    // Blinking indicator when waiting
    if ((phase === 'done') && Math.floor(Date.now() / 400) % 2 === 0) {
        ctx.fillStyle = PAL.black;
        ctx.fillRect(CANVAS_W - 32, CANVAS_H - 20, 8, 6);
        ctx.fillRect(CANVAS_W - 30, CANVAS_H - 14, 4, 3);
    }

    // Screen shake effect on "super effective"
    if (phase === 'move1' && t > 40 && t < 55) {
        const shake = Math.sin(t * 2) * 3;
        ctx.save();
        ctx.translate(shake, 0);
        ctx.restore();
    }
}

function handleSnippetBattleAction() {
    if (!snippetBattleState) return;
    // Pressing space advances through phases faster
    if (snippetBattleState.phase === 'done') {
        // Return to overworld
        snippetBattleState = null;
        transitionTimer = 30;
        transitionCallback = () => {
            state = 'overworld';
        };
    } else {
        // Skip to next phase
        snippetBattleState.timer = 999;
    }
}

// ============================================================
// PROGRESS SAVE/LOAD
// ============================================================
const SAVE_KEY = 'vibecheck-game-progress';

function saveProgress() {
    const data = {
        playerName: playerName,
        completedEncounters: Array.from(badges),
        checkInData: checkInData,
        playerPos: { x: player.x, y: player.y, dir: player.dir },
        snippetBotDefeated: snippetBotDefeated,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function loadProgress() {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    try {
        const data = JSON.parse(raw);
        if (!data.playerName || !data.completedEncounters) return false;
        playerName = data.playerName;
        badges = new Set(data.completedEncounters);
        checkInData = data.checkInData || checkInData;
        if (data.playerPos) {
            player.x = data.playerPos.x;
            player.y = data.playerPos.y;
            player.px = player.x * TILE;
            player.py = player.y * TILE;
            player.dir = data.playerPos.dir || 0;
        }
        snippetBotDefeated = data.snippetBotDefeated || false;
        return true;
    } catch (e) {
        return false;
    }
}

function clearProgress() {
    localStorage.removeItem(SAVE_KEY);
}

// ============================================================
// SAVE DATA & FINISH
// ============================================================
function finishGame() {
    state = 'complete';
    completeTimer = 0;
    particles = [];
    clearProgress(); // clear save on game completion

    const entry = {
        name: playerName,
        vibe: checkInData.vibe || '🎮',
        type: 'emoji',
        feeling: checkInData.feeling || null,
        lookingForward: checkInData.lookingForward || null,
        proudOf: checkInData.proudOf || null,
        talkAbout: checkInData.talkAbout || null,
        time: new Date().toISOString()
    };

    let feed = JSON.parse(localStorage.getItem('vibecheck-feed') || '[]');
    feed.unshift(entry);
    localStorage.setItem('vibecheck-feed', JSON.stringify(feed));
}

// ============================================================
// PAUSE MENU (ESC)
// ============================================================
function handlePauseMenuAction() {
    if (pauseMenuIdx === 0) {
        state = 'overworld';
    } else if (pauseMenuIdx === 1) {
        clearProgress();
        location.reload();
    } else if (pauseMenuIdx === 2) {
        window.location.href = 'index.html';
    }
}

function drawPauseMenu() {
    // Dark overlay
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    // Menu box
    const bw = 200, bh = 130;
    const bx = (CANVAS_W - bw) / 2, by = (CANVAS_H - bh) / 2;
    drawBox(bx, by, bw, bh);
    const items = ['Continue', 'New Game', 'Exit'];
    for (let i = 0; i < items.length; i++) {
        const iy = by + 24 + i * 30;
        if (i === pauseMenuIdx) {
            ctx.fillStyle = PAL.yellow;
            ctx.fillRect(bx + 16, iy - 2, bw - 32, 22);
            drawText('> ' + items[i], bx + 22, iy + 2, PAL.black, 1.1);
        } else {
            drawText('  ' + items[i], bx + 22, iy + 2, PAL.darkGray, 1);
        }
    }
    drawText('ESC to resume', bx + 50, by + bh - 18, PAL.gray, 0.9);
}

// ============================================================
// MINIMAP (overworld only)
// ============================================================
function drawMinimap() {
    const scale = 3;
    const mapW = COLS * scale;
    const mapH = ROWS * scale;
    const mx = 8, my = 8;

    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#000';
    ctx.fillRect(mx - 1, my - 1, mapW + 2, mapH + 2);

    for (let ty = 0; ty < ROWS; ty++) {
        for (let tx = 0; tx < COLS; tx++) {
            const tile = MAP[ty][tx];
            let color;
            switch (tile) {
                case 0: color = PAL.green; break;
                case 1: color = PAL.tan; break;
                case 2: color = PAL.darkGreen; break;
                case 3: color = PAL.water; break;
                case 4: color = PAL.green; break;
                case 5: color = '#9898a0'; break;
                case 6: color = '#e8d8a8'; break;
                case 7: color = '#1a5c2a'; break;
                case 8: color = PAL.brown; break;
                case 9: color = '#404040'; break;
                case 10: color = '#808080'; break;
                case 11: color = '#267842'; break;
                case 12: color = '#a8a098'; break;
                case 13: color = PAL.green; break;
                default: color = PAL.black;
            }
            ctx.fillStyle = color;
            ctx.fillRect(mx + tx * scale, my + ty * scale, scale, scale);
        }
    }

    // NPC dots
    for (const npc of NPCS) {
        const completed = badges.has(npc.id);
        ctx.fillStyle = completed ? '#666' : npc.color;
        ctx.fillRect(mx + npc.x * scale, my + npc.y * scale, scale, scale);
    }

    // Blinking player dot
    if (Math.floor(Date.now() / 300) % 2 === 0) {
        ctx.fillStyle = '#fff';
    } else {
        ctx.fillStyle = PAL.yellow;
    }
    ctx.fillRect(mx + player.x * scale, my + player.y * scale, scale, scale);

    ctx.globalAlpha = 1.0;
}

// ============================================================
// MOUSE/TOUCH SUPPORT
// ============================================================
canvas.addEventListener('click', handleCanvasClick);
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    const x = (touch.clientX - rect.left) * scaleX;
    const y = (touch.clientY - rect.top) * scaleY;
    handleClickAt(x, y);
}, { passive: false });

function handleCanvasClick(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = CANVAS_W / rect.width;
    const scaleY = CANVAS_H / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    handleClickAt(x, y);
}

function handleClickAt(x, y) {
    if (state === 'title') {
        handleAction();
    } else if (state === 'nameSelect') {
        const spriteSpacing = 72;
        const spriteStartX = (CANVAS_W - (TEAM.length * spriteSpacing)) / 2 + 20;
        for (let i = 0; i < TEAM.length; i++) {
            const sx = spriteStartX + i * spriteSpacing;
            if (x >= sx - 6 && x <= sx + 36 && y >= 30 && y <= 100) {
                nameSelectIdx = i;
                handleAction();
                return;
            }
        }
    } else if (state === 'dialogue') {
        handleAction();
    } else if (state === 'battle' && battleState.phase === 'emoji') {
        const cols = 8;
        const cellW = 52;
        const cellH = 42;
        const startX = 24;
        const startY = 174;
        const total = Math.min(EMOJIS.length, 24);

        for (let i = 0; i < total; i++) {
            const col = i % cols;
            const row = Math.floor(i / cols);
            const ex = startX + col * cellW;
            const ey = startY + row * cellH;
            if (x >= ex && x <= ex + 30 && y >= ey && y <= ey + 30) {
                battleState.emojiIdx = i;
                return;
            }
        }
        // Confirm button
        if (x >= confirmBtnX && x <= confirmBtnX + confirmBtnW && y >= confirmBtnY && y <= confirmBtnY + confirmBtnH) {
            const emoji = EMOJIS[battleState.emojiIdx];
            checkInData.vibe = emoji;
            battleState.phase = 'complete';
        }
    } else if (state === 'battle' && battleState.phase === 'prompt') {
        handleAction();
    } else if (state === 'battle' && battleState.phase === 'text') {
        hiddenInput.focus();
    } else if (state === 'battle' && battleState.phase === 'complete') {
        handleAction();
    } else if (state === 'pauseMenu') {
        const bw = 200, bh = 130;
        const bx = (CANVAS_W - bw) / 2, by = (CANVAS_H - bh) / 2;
        for (let i = 0; i < 3; i++) {
            const iy = by + 24 + i * 30;
            if (x >= bx + 16 && x <= bx + bw - 16 && y >= iy - 2 && y <= iy + 20) {
                pauseMenuIdx = i;
                handlePauseMenuAction();
                return;
            }
        }
    } else if (state === 'complete') {
        if (completeTimer > 60) handleAction();
    } else if (state === 'snippetBattle') {
        handleAction();
    }
}

// ============================================================
// MOBILE TOUCH CONTROLS
// ============================================================
(function() {
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouchDevice) return;

    document.body.classList.add('is-touch');
    const touchControls = document.getElementById('touchControls');
    touchControls.classList.add('visible');

    const dirMap = {
        up: 'ArrowUp',
        down: 'ArrowDown',
        left: 'ArrowLeft',
        right: 'ArrowRight'
    };

    // D-pad buttons
    const dpadBtns = document.querySelectorAll('.dpad-btn');
    dpadBtns.forEach(btn => {
        const dir = btn.dataset.dir;
        const keyName = dirMap[dir];

        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            keys[keyName] = true;
            btn.classList.add('active');
        }, { passive: false });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            keys[keyName] = false;
            btn.classList.remove('active');
        }, { passive: false });

        btn.addEventListener('touchcancel', (e) => {
            keys[keyName] = false;
            btn.classList.remove('active');
        });
    });

    // Action button (equivalent to SPACE)
    const actionBtn = document.getElementById('actionBtn');
    actionBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        actionBtn.classList.add('active');
        handleAction();
    }, { passive: false });

    actionBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        actionBtn.classList.remove('active');
    }, { passive: false });

    // Tap on canvas (not on controls) to interact when near NPC
    canvas.addEventListener('touchstart', function(e) {
        // If already handled by the existing touchstart for click-like interactions, skip NPC proximity check
        // The existing handler already calls handleClickAt which handles encounters/menus
        // We add NPC proximity interaction for overworld taps
        if (state === 'overworld') {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_W / rect.width;
            const scaleY = CANVAS_H / rect.height;
            const x = (touch.clientX - rect.left) * scaleX;
            const y = (touch.clientY - rect.top) * scaleY;

            // Check if player is near an NPC and trigger interaction
            for (const npc of NPCS) {
                const dx = Math.abs(player.x - npc.x);
                const dy = Math.abs(player.y - npc.y);
                if (dx + dy <= 2) {
                    e.preventDefault();
                    handleAction();
                    return;
                }
            }
        }
    }, { passive: false });

    // Prevent scrolling/bouncing on the game container
    document.getElementById('gameContainer').addEventListener('touchmove', (e) => {
        e.preventDefault();
    }, { passive: false });

    // Prevent default on touch controls area to avoid scroll
    touchControls.addEventListener('touchmove', (e) => {
        e.preventDefault();
    }, { passive: false });
})();

// ============================================================
// MAIN GAME LOOP
// ============================================================

function gameLoop() {
    // Water animation tick
    waterTick++;
    if (waterTick >= 30) {
        waterFrame = 1 - waterFrame;
        waterTick = 0;
    }

    // Clear
    ctx.fillStyle = PAL.black;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    switch (state) {
        case 'title':
            drawTitle();
            break;
        case 'nameSelect':
            drawNameSelect();
            break;
        case 'intro':
            drawIntro();
            break;
        case 'overworld':
            movePlayer();
            drawOverworld();
            drawMinimap();
            break;
        case 'dialogue':
            drawDialogueBox();
            break;
        case 'battle':
            drawBattle();
            break;
        case 'snippetBattle':
            drawSnippetBattle();
            break;
        case 'complete':
            drawComplete();
            break;
        case 'pauseMenu':
            drawOverworld();
            drawPauseMenu();
            break;
    }

    // Transition overlay
    if (transitionTimer > 0) {
        drawTransition();
    }

    requestAnimationFrame(gameLoop);
}

// Load saved progress on startup
if (loadProgress()) {
    state = 'overworld';
}

// Start the loop
gameLoop();
</script>
