<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE CHECK — Adventure Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            width: 768px;
            height: 576px;
            border: 6px solid #222;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
        .mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid #444;
            border-radius: 4px;
            background: #222;
            color: #888;
            font-size: 0.7rem;
            font-family: monospace;
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
        }
        .mode-toggle:hover { border-color: #888; color: #fff; }
        .controls-hint {
            font-size: 0.65rem;
            color: #444;
            margin-top: 0.5rem;
            font-family: monospace;
        }
        /* Hidden input for text encounters */
        #hiddenInput {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <a href="index.html" class="mode-toggle">[ classic mode ]</a>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="256" height="192"></canvas>
    </div>
    <p class="controls-hint">ARROWS/WASD: move | SPACE/ENTER: interact | explore the island!</p>
    <input type="text" id="hiddenInput" maxlength="140" autocomplete="off" />

<script>
// ============================================================
// VIBE CHECK: POKEMON-STYLE RPG

// ============================================================

const CANVAS_W = 256;
const CANVAS_H = 192;
const TILE = 16;
const COLS = CANVAS_W / TILE; // 16
const ROWS = CANVAS_H / TILE; // 12

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const hiddenInput = document.getElementById('hiddenInput');

// ============================================================
// COLOR PALETTE (GBC-inspired)
// ============================================================
const PAL = {
    black: '#081820',
    darkGreen: '#1e4d2b',
    green: '#2d8b4e',
    lightGreen: '#88d058',
    paleGreen: '#c8e898',
    brown: '#8b5e3c',
    darkBrown: '#5c3a1e',
    tan: '#d4a76a',

    water: '#3080c0',
    waterLight: '#68b8e8',
    waterDark: '#185888',
    white: '#f8f8f0',

    gray: '#888888',
    darkGray: '#484848',

    yellow: '#f8d030',
};

// ============================================================
// TEAM & DATA
// ============================================================
const TEAM = ['Ben', 'Karina', 'Terrence', 'Jun', 'Aditya'];
const EMOJIS = ['🔥','😴','🚀','😤','🧘','🎉','💀','☕','🧠','💪','😅','🫠','✨','🌊','🎯','🤯','😎','🥲','🫡','🦾','🌈','😬','🍕','⚡'];

// ============================================================
// GAME STATE
// ============================================================
let state = 'title'; // title, nameSelect, overworld, dialogue, encounter, battle, complete
let playerName = null;
let player = { x: 7, y: 8, px: 7*TILE, py: 8*TILE, dir: 0, moving: false, step: 0, animTimer: 0 };
let keys = {};
let keysJustPressed = {};
let dialogueLines = [];
let dialogueIdx = 0;
let dialogueCallback = null;
let titleAnimTimer = 0;
let nameSelectIdx = 0;
let encounters = {};
let checkInData = { vibe: null, feeling: '', lookingForward: '', proudOf: '', talkAbout: '' };
let badges = new Set();
let battleState = {};
let textInputActive = false;
let textInputValue = '';
let textInputCursor = 0;
let textCursorBlink = 0;
let transitionTimer = 0;
let transitionType = null;
let transitionCallback = null;
let completeTimer = 0;
let particles = [];

// Direction: 0=down, 1=up, 2=left, 3=right
const DIR_DX = [0, 0, -1, 1];
const DIR_DY = [1, -1, 0, 0];

// ============================================================
// MAP DATA (16x12 tiles)
// 0=grass, 1=path, 2=tree, 3=water, 4=flower, 5=building, 6=sign, 7=fence

const MAP = [

    [2,0,0,0,0,0,1,3,3,1,0,0,0,0,0,2],
    [2,0,0,0,0,0,1,3,3,1,0,0,0,0,0,2],

// NPC locations and data
const NPCS = [
    { id: 'vibe', x: 3, y: 2, color: PAL.red, name: 'EMOJI SHRINE', badge: 'Vibe',
      dialogue: ['This is the EMOJI SHRINE!', 'Choose an emoji that represents your vibe today.'],

    { id: 'feeling', x: 12, y: 2, color: PAL.blue, name: 'FEELINGS FOUNTAIN', badge: 'Feeling',
      dialogue: ['Welcome to the FEELINGS FOUNTAIN.', 'Tell me... how are you feeling today?'],

      encounter: { type: 'text', title: 'PRIDE PEAK', field: 'proudOf', prompt: 'Something you were proud of this week?' } },
    { id: 'discuss', x: 7, y: 10, color: PAL.green, name: 'DISCUSSION DEN', badge: 'Discuss',
      dialogue: ['The DISCUSSION DEN awaits...', 'Is there anything we need to talk about today?'],
      encounter: { type: 'text', title: 'DISCUSSION DEN', field: 'talkAbout', prompt: 'Anything we need to talk about today?' } },
];

// ============================================================
// PIXEL FONT (simple 5x7 bitmap font for key characters)
// ============================================================
const FONT_DATA = {};
function initFont() {
    // We'll use canvas measureText with monospace for simplicity
    // but draw with a chunky pixel style
}

function drawText(text, x, y, color = PAL.black, scale = 1) {
    ctx.fillStyle = color;
    ctx.font = `${7 * scale}px monospace`;
    ctx.textBaseline = 'top';
    ctx.fillText(text, x, y);
}

function drawTextCentered(text, x, y, color = PAL.black, scale = 1) {
    ctx.fillStyle = color;
    ctx.font = `${7 * scale}px monospace`;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'center';
    ctx.fillText(text, x, y);
    ctx.textAlign = 'start';
}

// ============================================================
// CHARACTER SPRITE DATA (16x24 pixel art, stored as color arrays)
// Each character has: front1, front2 (idle frames), back, left, right
// Colors: 0=transparent, 1=skin, 2=hair, 3=shirt, 4=pants, 5=shoes, 6=accent(hat/glasses)
// ============================================================
const CHAR_PALETTES = {
    Ben:      { skin:'#f0d8a0', hair:'#5c3a1e', shirt:'#3060b8', pants:'#1e3050', shoes:'#222', accent:'#c83038' }, // red cap
    Karina:   { skin:'#f0d8a0', hair:'#e8c840', shirt:'#2d8b4e', pants:'#1e4d2b', shoes:'#5c3a1e', accent:'#88d058' }, // blonde, green
    Terrence: { skin:'#c89060', hair:'#181818', shirt:'#483878', pants:'#282040', shoes:'#222', accent:'#7848a0' }, // purple jacket
    Jun:      { skin:'#f0d0a0', hair:'#101010', shirt:'#f0f0f0', pants:'#384058', shoes:'#333', accent:'#88bbee' }, // glasses, white shirt
    Aditya:   { skin:'#c8a060', hair:'#181010', shirt:'#e89020', pants:'#483820', shoes:'#222', accent:'#f8d030' }, // orange shirt
};

// Sprite pixel maps (16 wide x 24 tall) — simplified representations
// Each sprite is defined as drawing instructions for efficiency
function drawCharSprite(x, y, charName, dir, frame, scale) {
    scale = scale || 1;
    const pal = CHAR_PALETTES[charName];
    if (!pal) return;

    const s = scale; // shorthand
    const bob = (frame % 2 === 0) ? 0 : -1 * s; // idle bob

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x + 3*s, y + 21*s, 10*s, 3*s);

    if (dir === 1) {
        // BACK VIEW
        // Hair (covers head from back)
        ctx.fillStyle = pal.hair;
        ctx.fillRect(x+4*s, y+bob+0*s, 8*s, 8*s);
        // Hat for Ben
        if (charName === 'Ben') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+3*s, y+bob+0*s, 10*s, 3*s);
        }
        // Body/shirt
        ctx.fillStyle = pal.shirt;
        ctx.fillRect(x+4*s, y+bob+8*s, 8*s, 8*s);
        // Arms
        ctx.fillRect(x+2*s, y+bob+9*s, 2*s, 6*s);
        ctx.fillRect(x+12*s, y+bob+9*s, 2*s, 6*s);
        // Pants
        ctx.fillStyle = pal.pants;
        ctx.fillRect(x+4*s, y+bob+16*s, 8*s, 4*s);
        // Legs/shoes
        ctx.fillStyle = pal.shoes;
        if (frame % 2 === 0) {
            ctx.fillRect(x+4*s, y+bob+20*s, 3*s, 3*s);
            ctx.fillRect(x+9*s, y+bob+21*s, 3*s, 2*s);
        } else {
            ctx.fillRect(x+4*s, y+bob+21*s, 3*s, 2*s);
            ctx.fillRect(x+9*s, y+bob+20*s, 3*s, 3*s);
        }
    } else if (dir === 2) {
        // LEFT VIEW
        // Head
        ctx.fillStyle = pal.skin;
        ctx.fillRect(x+5*s, y+bob+1*s, 6*s, 7*s);
        // Hair
        ctx.fillStyle = pal.hair;
        ctx.fillRect(x+4*s, y+bob+0*s, 8*s, 3*s);
        ctx.fillRect(x+9*s, y+bob+1*s, 3*s, 5*s);
        if (charName === 'Ben') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+3*s, y+bob+0*s, 9*s, 2*s);
            ctx.fillRect(x+2*s, y+bob+0*s, 3*s, 2*s);
        }
        if (charName === 'Jun') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+4*s, y+bob+4*s, 3*s, 1*s);
        }
        // Eye
        ctx.fillStyle = '#081820';
        ctx.fillRect(x+5*s, y+bob+4*s, 2*s, 2*s);
        // Body
        ctx.fillStyle = pal.shirt;
        ctx.fillRect(x+5*s, y+bob+8*s, 7*s, 8*s);
        // Arm
        ctx.fillStyle = pal.skin;
        ctx.fillRect(x+4*s, y+bob+9*s, 2*s, 5*s);
        // Pants
        ctx.fillStyle = pal.pants;
        ctx.fillRect(x+5*s, y+bob+16*s, 7*s, 4*s);
        // Shoes
        ctx.fillStyle = pal.shoes;
        if (frame % 2 === 0) {
            ctx.fillRect(x+5*s, y+bob+20*s, 3*s, 3*s);
            ctx.fillRect(x+9*s, y+bob+21*s, 3*s, 2*s);
        } else {
            ctx.fillRect(x+5*s, y+bob+21*s, 3*s, 2*s);
            ctx.fillRect(x+9*s, y+bob+20*s, 3*s, 3*s);
        }
    } else if (dir === 3) {
        // RIGHT VIEW
        ctx.fillStyle = pal.skin;
        ctx.fillRect(x+5*s, y+bob+1*s, 6*s, 7*s);
        // Hair
        ctx.fillStyle = pal.hair;
        ctx.fillRect(x+4*s, y+bob+0*s, 8*s, 3*s);
        ctx.fillRect(x+4*s, y+bob+1*s, 3*s, 5*s);
        if (charName === 'Ben') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+4*s, y+bob+0*s, 9*s, 2*s);
            ctx.fillRect(x+11*s, y+bob+0*s, 3*s, 2*s);
        }
        if (charName === 'Jun') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+9*s, y+bob+4*s, 3*s, 1*s);
        }
        // Eye
        ctx.fillStyle = '#081820';
        ctx.fillRect(x+9*s, y+bob+4*s, 2*s, 2*s);
        // Body
        ctx.fillStyle = pal.shirt;
        ctx.fillRect(x+4*s, y+bob+8*s, 7*s, 8*s);
        // Arm
        ctx.fillStyle = pal.skin;
        ctx.fillRect(x+10*s, y+bob+9*s, 2*s, 5*s);
        // Pants
        ctx.fillStyle = pal.pants;
        ctx.fillRect(x+4*s, y+bob+16*s, 7*s, 4*s);
        // Shoes
        ctx.fillStyle = pal.shoes;
        if (frame % 2 === 0) {
            ctx.fillRect(x+4*s, y+bob+20*s, 3*s, 3*s);
            ctx.fillRect(x+8*s, y+bob+21*s, 3*s, 2*s);
        } else {
            ctx.fillRect(x+4*s, y+bob+21*s, 3*s, 2*s);
            ctx.fillRect(x+8*s, y+bob+20*s, 3*s, 3*s);
        }
    } else {
        // FRONT VIEW (dir === 0)
        // Head
        ctx.fillStyle = pal.skin;
        ctx.fillRect(x+4*s, y+bob+1*s, 8*s, 7*s);
        // Hair
        ctx.fillStyle = pal.hair;
        ctx.fillRect(x+3*s, y+bob+0*s, 10*s, 3*s);
        ctx.fillRect(x+3*s, y+bob+1*s, 2*s, 4*s);
        ctx.fillRect(x+11*s, y+bob+1*s, 2*s, 4*s);
        // Character-specific features
        if (charName === 'Ben') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+3*s, y+bob+0*s, 10*s, 2*s);
        }
        if (charName === 'Karina') {
            // Longer blonde hair sides
            ctx.fillStyle = pal.hair;
            ctx.fillRect(x+2*s, y+bob+2*s, 2*s, 7*s);
            ctx.fillRect(x+12*s, y+bob+2*s, 2*s, 7*s);
        }
        if (charName === 'Jun') {
            // Glasses
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+4*s, y+bob+4*s, 4*s, 2*s);
            ctx.fillRect(x+9*s, y+bob+4*s, 4*s, 2*s);
            ctx.fillRect(x+8*s, y+bob+4*s, 1*s, 1*s);
        }
        // Eyes
        ctx.fillStyle = '#081820';
        ctx.fillRect(x+5*s, y+bob+4*s, 2*s, 2*s);
        ctx.fillRect(x+9*s, y+bob+4*s, 2*s, 2*s);
        // Body/shirt
        ctx.fillStyle = pal.shirt;
        ctx.fillRect(x+4*s, y+bob+8*s, 8*s, 8*s);
        // Arms
        ctx.fillRect(x+2*s, y+bob+9*s, 2*s, 6*s);
        ctx.fillRect(x+12*s, y+bob+9*s, 2*s, 6*s);
        // Accent detail on shirt
        if (charName === 'Terrence') {
            ctx.fillStyle = pal.accent;
            ctx.fillRect(x+6*s, y+bob+9*s, 4*s, 2*s);
        }
        if (charName === 'Aditya') {
            ctx.fillStyle = '#fff';
            ctx.fillRect(x+6*s, y+bob+10*s, 4*s, 1*s);
        }
        // Pants
        ctx.fillStyle = pal.pants;
        ctx.fillRect(x+4*s, y+bob+16*s, 8*s, 4*s);
        // Legs/shoes (animated)
        ctx.fillStyle = pal.shoes;
        if (frame % 2 === 0) {
            ctx.fillRect(x+4*s, y+bob+20*s, 3*s, 3*s);
            ctx.fillRect(x+9*s, y+bob+21*s, 3*s, 2*s);
        } else {
            ctx.fillRect(x+4*s, y+bob+21*s, 3*s, 2*s);
            ctx.fillRect(x+9*s, y+bob+20*s, 3*s, 3*s);
        }
    }
}

let charSelectAnimTimer = 0;

// ============================================================
// SPRITE DRAWING (all pixel art via canvas)
// ============================================================
function drawTile(tx, ty, type) {
    const x = tx * TILE;
    const y = ty * TILE;

    switch(type) {
        case 0: // Grass
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, TILE, TILE);
            // Grass detail
            ctx.fillStyle = PAL.lightGreen;
            if ((tx + ty) % 3 === 0) {
                ctx.fillRect(x+3, y+6, 2, 3);
                ctx.fillRect(x+9, y+10, 2, 3);
            }
            if ((tx + ty) % 5 === 0) {
                ctx.fillRect(x+7, y+3, 2, 3);
            }
            break;
        case 1: // Path
            ctx.fillStyle = PAL.tan;
            ctx.fillRect(x, y, TILE, TILE);
            ctx.fillStyle = PAL.lightTan;
            ctx.fillRect(x+2, y+2, 4, 4);
            ctx.fillRect(x+10, y+8, 4, 4);
            break;
        case 2: // Tree
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, TILE, TILE);
            // Trunk
            ctx.fillStyle = PAL.darkBrown;
            ctx.fillRect(x+6, y+10, 4, 6);
            // Canopy
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+2, y+2, 12, 10);
            ctx.fillRect(x+4, y+0, 8, 4);
            // Highlight
            ctx.fillStyle = PAL.lightGreen;
            ctx.fillRect(x+4, y+3, 4, 3);
            break;
        case 3: // Water
            ctx.fillStyle = PAL.water;
            ctx.fillRect(x, y, TILE, TILE);
            // Ripples
            ctx.fillStyle = PAL.waterLight;
            const waveOff = Math.floor(Date.now() / 500) % 4;
            ctx.fillRect(x + ((waveOff + tx*3) % 12), y+4, 6, 2);
            ctx.fillRect(x + ((waveOff + tx*7 + 6) % 12), y+10, 5, 2);
            break;
        case 4: // Flower
            ctx.fillStyle = PAL.green;
            ctx.fillRect(x, y, TILE, TILE);
            // Flower
            ctx.fillStyle = PAL.red;
            ctx.fillRect(x+6, y+5, 4, 4);
            ctx.fillStyle = PAL.yellow;
            ctx.fillRect(x+7, y+6, 2, 2);
            // Stem
            ctx.fillStyle = PAL.darkGreen;
            ctx.fillRect(x+7, y+9, 2, 4);
            break;
    }
}

function drawNPC(npc) {
    const x = npc.x * TILE;
    const y = npc.y * TILE;
    const completed = badges.has(npc.id);

    // Body
    ctx.fillStyle = completed ? PAL.gray : npc.color;
    ctx.fillRect(x+4, y+4, 8, 10);
    // Head
    ctx.fillStyle = PAL.lightTan;
    ctx.fillRect(x+5, y+1, 6, 5);
    // Eyes
    ctx.fillStyle = PAL.black;
    ctx.fillRect(x+6, y+3, 2, 2);
    ctx.fillRect(x+9, y+3, 2, 2);
    // Hat/identifier colored top
    ctx.fillStyle = completed ? PAL.darkGray : npc.color;
    ctx.fillRect(x+4, y+0, 8, 2);

    // Exclamation mark if not completed
    if (!completed) {
        const bounce = Math.sin(Date.now() / 300) * 2;
        ctx.fillStyle = PAL.yellow;
        ctx.fillRect(x+7, y - 6 + bounce, 2, 3);
        ctx.fillRect(x+7, y - 2 + bounce, 2, 1);
    }
}

function drawPlayer() {
    const x = Math.round(player.px);
    const y = Math.round(player.py);
    const frame = player.moving ? player.step : 0;
    const dir = player.dir;

    // Draw using character sprite system — offset to fit 16x16 tile from 16x24 sprite
    drawCharSprite(x, y - 8, playerName || 'Ben', dir, frame, 1);
}

// ============================================================
// TITLE SCREEN
// ============================================================
function drawTitle() {
    titleAnimTimer++;

    // Background
    ctx.fillStyle = PAL.darkGreen;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Decorative pattern
    for (let i = 0; i < 16; i++) {
        for (let j = 0; j < 12; j++) {
            if ((i + j) % 4 === 0) {
                ctx.fillStyle = PAL.green;
                ctx.fillRect(i*16+2, j*16+2, 12, 12);
            }
        }
    }

    // Title box
    ctx.fillStyle = PAL.black;
    ctx.fillRect(30, 30, CANVAS_W-60, 70);
    ctx.fillStyle = PAL.white;
    ctx.fillRect(32, 32, CANVAS_W-64, 66);
    ctx.fillStyle = PAL.black;
    ctx.fillRect(34, 34, CANVAS_W-68, 62);

    // Title text
    const titleY = 48;
    ctx.fillStyle = PAL.yellow;
    ctx.font = '16px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('VIBE CHECK', CANVAS_W/2, titleY);
    ctx.fillStyle = PAL.white;
    ctx.font = '8px monospace';
    ctx.fillText('ADVENTURE MODE', CANVAS_W/2, titleY + 22);
    ctx.fillText('v2.0', CANVAS_W/2, titleY + 34);

    // Animated Pokemon-style sprite in center
    const sprY = 115 + Math.sin(titleAnimTimer / 20) * 3;
    // Draw a little character
    ctx.fillStyle = PAL.blue;
    ctx.fillRect(120, sprY, 16, 16);
    ctx.fillStyle = PAL.lightTan;
    ctx.fillRect(122, sprY-6, 12, 8);
    ctx.fillStyle = PAL.red;
    ctx.fillRect(122, sprY-8, 12, 3);

    // Version/copyright style text
    ctx.fillStyle = PAL.lightGreen;
    ctx.font = '7px monospace';
    ctx.fillText('2026 STRIPE APAC PMM', CANVAS_W/2, 145);

    // Press Start (blinking)

// ============================================================
// TRANSITION EFFECT
// ============================================================
function drawTransition() {
    if (transitionTimer <= 0) return true; // done

    const progress = transitionTimer / 30;
    // Screen wipe with black bars
    const barH = CANVAS_H * (1 - progress) / 2;
    ctx.fillStyle = PAL.black;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H/2 - barH * (CANVAS_H/2) + CANVAS_H/2 * (1-progress));

    // Flash effect
    if (transitionTimer > 25) {
        ctx.fillStyle = `rgba(255,255,255,${(transitionTimer-25)/5})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    if (transitionTimer > 15 && transitionTimer < 20) {
        ctx.fillStyle = PAL.black;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    transitionTimer--;
    if (transitionTimer <= 0 && transitionCallback) {
        transitionCallback();
        transitionCallback = null;
    }
    return false;
}

// ============================================================
// UI HELPER: Draw Pokemon-style box
// ============================================================
function drawBox(x, y, w, h) {
    // Outer border (black)
    ctx.fillStyle = PAL.black;
    ctx.fillRect(x, y, w, h);
    // Inner white
    ctx.fillStyle = PAL.white;
    ctx.fillRect(x+2, y+2, w-4, h-4);
    // Inner border
    ctx.strokeStyle = PAL.black;
    ctx.lineWidth = 1;
    ctx.strokeRect(x+4, y+4, w-8, h-8);
}

// ============================================================
// MOVEMENT & COLLISION
// ============================================================
function isWalkable(tx, ty) {
    if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return false;
    const tile = MAP[ty][tx];
    if (tile === 2 || tile === 3) return false; // tree, water
    // Check NPC collision
    for (const npc of NPCS) {
        if (npc.x === tx && npc.y === ty) return false;
    }
    return true;
}

function getFacingTile() {
    return {
        x: player.x + DIR_DX[player.dir],
        y: player.y + DIR_DY[player.dir]
    };
}

function movePlayer() {
    if (player.moving) {
        // Animate toward target
        const targetX = player.x * TILE;
        const targetY = player.y * TILE;
        const speed = 2;

        if (Math.abs(player.px - targetX) > speed) {
            player.px += player.px < targetX ? speed : -speed;
        } else {
            player.px = targetX;
        }
        if (Math.abs(player.py - targetY) > speed) {
            player.py += player.py < targetY ? speed : -speed;
        } else {
            player.py = targetY;
        }

        if (player.px === targetX && player.py === targetY) {
            player.moving = false;
        }

        player.animTimer++;
        if (player.animTimer > 8) {
            player.step = (player.step + 1) % 4;
            player.animTimer = 0;
        }
        return;
    }

    let dir = -1;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) dir = 1;
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) dir = 0;
    else if (keys['ArrowLeft'] || keys['a'] || keys['A']) dir = 2;
    else if (keys['ArrowRight'] || keys['d'] || keys['D']) dir = 3;

    if (dir >= 0) {
        player.dir = dir;
        const nx = player.x + DIR_DX[dir];
        const ny = player.y + DIR_DY[dir];
        if (isWalkable(nx, ny)) {
            player.x = nx;
            player.y = ny;
            player.moving = true;
            player.animTimer = 0;
        }
    }
}

// ============================================================
// INPUT HANDLING
// ============================================================
document.addEventListener('keydown', (e) => {
    if (textInputActive) {
        if (e.key === 'Enter') {
            e.preventDefault();
            submitTextInput();
        } else if (e.key === 'Backspace') {
            e.preventDefault();
            textInputValue = textInputValue.slice(0, -1);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            textInputValue = '';
            submitTextInput();
        } else if (e.key.length === 1 && textInputValue.length < 140) {
            textInputValue += e.key;
        }
        return;
    }

    keys[e.key] = true;

    if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleAction();
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

function handleAction() {
    switch (state) {
        case 'title':
            state = 'nameSelect';
            break;
        case 'nameSelect':
            playerName = TEAM[nameSelectIdx];
            state = 'dialogue';
            dialogueLines = [
                'Welcome to VIBE ISLAND, ' + playerName + '!',
                'Explore and visit each station.',
                'Walk up and press SPACE to interact.',
                'Complete all 5 to finish your check-in!'
            ];
            dialogueIdx = 0;
            dialogueCallback = () => { state = 'overworld'; };
            break;
        case 'dialogue':
            dialogueIdx++;
            if (dialogueIdx >= dialogueLines.length) {
                state = 'overworld';
                if (dialogueCallback) {
                    dialogueCallback();
                    dialogueCallback = null;
                }
            }
            break;
        case 'overworld':
            // Check if facing an NPC
            const facing = getFacingTile();
            for (const npc of NPCS) {
                if (npc.x === facing.x && npc.y === facing.y) {
                    interactWithNPC(npc);
                    return;
                }
            }
            break;
        case 'battle':
            handleBattleAction();
            break;
        case 'complete':
            if (completeTimer > 60) {
                location.reload();
            }
            break;
    }
}

function interactWithNPC(npc) {
    if (badges.has(npc.id)) {
        state = 'dialogue';
        dialogueLines = ['You already visited ' + npc.name + '!', 'Keep exploring!'];
        dialogueIdx = 0;
        dialogueCallback = null;
        return;
    }

    // Show NPC dialogue then transition to battle
    state = 'dialogue';
    dialogueLines = npc.dialogue;
    dialogueIdx = 0;
    dialogueCallback = () => {
        // Start battle transition
        transitionTimer = 30;
        transitionCallback = () => {
            state = 'battle';
            battleState = {
                active: true,
                npc: npc,
                encounter: npc.encounter,
                npcColor: npc.color,
                badgeName: npc.badge,
                phase: 'prompt',
                emojiIdx: 0,
            };
        };
    };
}

function handleBattleAction() {
    if (!battleState.active) return;

    if (battleState.phase === 'prompt') {
        if (battleState.encounter.type === 'emoji') {
            battleState.phase = 'emoji';
        } else {
            battleState.phase = 'text';
            textInputActive = true;
            textInputValue = '';
        }
    } else if (battleState.phase === 'emoji') {
        // Select current emoji
        const emoji = EMOJIS[battleState.emojiIdx];
        checkInData.vibe = emoji;
        battleState.phase = 'complete';
    } else if (battleState.phase === 'complete') {
        // End battle
        badges.add(battleState.npc.id);
        battleState.active = false;

        if (badges.size === 5) {
            transitionTimer = 30;
            transitionCallback = () => {
                finishGame();
            };
        } else {
            transitionTimer = 30;
            transitionCallback = () => {
                state = 'overworld';
            };
        }
    }
}

function submitTextInput() {
    textInputActive = false;
    const field = battleState.encounter.field;
    if (field) {
        checkInData[field] = textInputValue.trim();
    }
    battleState.phase = 'complete';
}

// Arrow key handling for emoji picker and name select
function handleArrowsForUI(key) {
    if (state === 'nameSelect') {
        if (key === 'ArrowLeft' || key === 'a' || key === 'A') {
            nameSelectIdx = (nameSelectIdx - 1 + TEAM.length) % TEAM.length;
        } else if (key === 'ArrowRight' || key === 'd' || key === 'D') {
            nameSelectIdx = (nameSelectIdx + 1) % TEAM.length;
        }
    } else if (state === 'battle' && battleState.phase === 'emoji') {
        const cols = 8;
        const total = Math.min(EMOJIS.length, 24);
        let idx = battleState.emojiIdx;
        if (key === 'ArrowRight' || key === 'd' || key === 'D') idx = (idx + 1) % total;
        else if (key === 'ArrowLeft' || key === 'a' || key === 'A') idx = (idx - 1 + total) % total;
        else if (key === 'ArrowDown' || key === 's' || key === 'S') idx = Math.min(idx + cols, total - 1);
        else if (key === 'ArrowUp' || key === 'w' || key === 'W') idx = Math.max(idx - cols, 0);
        battleState.emojiIdx = idx;
    }
}

// Override keydown for UI navigation
document.addEventListener('keydown', (e) => {
    if (textInputActive) return;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','W','a','A','s','S','d','D'].includes(e.key)) {
        handleArrowsForUI(e.key);
    }
});

// ============================================================
// SAVE DATA
// ============================================================
function finishGame() {
    state = 'complete';
    completeTimer = 0;
    particles = [];

    const entry = {
        name: playerName,
        vibe: checkInData.vibe || '🎮',
        type: 'emoji',
        feeling: checkInData.feeling || null,
        lookingForward: checkInData.lookingForward || null,
        proudOf: checkInData.proudOf || null,
        talkAbout: checkInData.talkAbout || null,
        time: new Date().toISOString()
    };

    let feed = JSON.parse(localStorage.getItem('vibecheck-feed') || '[]');
    feed.unshift(entry);
    localStorage.setItem('vibecheck-feed', JSON.stringify(feed));
}

// ============================================================
// MAIN GAME LOOP
// ============================================================
function gameLoop() {
    // Clear
    ctx.fillStyle = PAL.black;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    switch (state) {
        case 'title':
            drawTitle();
            break;
        case 'nameSelect':
            drawNameSelect();
            break;
        case 'overworld':
            movePlayer();
            drawOverworld();
            break;
        case 'dialogue':
            drawDialogueBox();
            break;
        case 'battle':
            drawBattle();
            break;
        case 'complete':
            drawComplete();
            break;
    }

    // Transition overlay
    if (transitionTimer > 0) {
        drawTransition();
    }

    requestAnimationFrame(gameLoop);
}

// Start the loop
gameLoop();
</script>
</body>
</html>
